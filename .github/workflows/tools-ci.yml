name: Tools CI

on:
  push:
    branches: [master]
    paths:
      - "tools/**"
      - ".github/workflows/tools-ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tools CI
        run: node tools/scripts/ci.cjs

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="DevTools" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>DevTools · 本地实用小工具合集</title>
  <script>try{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('is-pwa-standalone')}catch(e){}</script>
  <script src="./lib/tools-build.js?v=2026.09.10-222347"></script>
  <link rel="stylesheet" href="./style.css?v=2026.09.10-222347" />
  <link rel="stylesheet" href="./workspace-nav.css?v=2026.09.10-222347" />
  <link rel="stylesheet" href="./styles/bridge-shell.css?v=2026.09.10-222347" />
  <script src="./lib/theme-presets.js?v=2026.09.10-222347"></script>
  <script src="./lib/boot-loader.js?v=2026.09.10-222347"></script>
  <script>
  (function(){try{var raw=String(location.hash||'').replace(/^#/,'').trim();var head=raw.split(/[/?]/)[0]||'';var last=localStorage.getItem('devtools-tool-last-v1');var id='timestamp';if(head&&head!=='timestamp')id=head;else if(last&&last!=='timestamp')id=last;document.documentElement.dataset.bootPanel=id;}catch(e){document.documentElement.dataset.bootPanel='timestamp'}})();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <div class="header-brand-block">
        <a class="brand" href="./"><span class="brand-mark"></span><span class="brand-name">DevTools</span></a>
        <span class="tool-ver site-tools-ver mono" id="site-tools-version">v2026.09.10-222347</span>
      </div>
      <div class="header-actions">
        <button type="button" class="ghost-btn header-action-collapse" id="site-force-refresh">强制刷新</button>
        <button type="button" class="ghost-btn site-chrome-toggle" id="site-chrome-toggle" aria-pressed="false">隐藏顶栏</button>
        <button type="button" class="ghost-btn" id="theme-open">主题</button>
        <a class="ghost-btn header-about-link header-action-collapse" href="#about">关于</a>
        <a class="ghost-btn header-about-link header-action-collapse" href="#setup">安装帮助</a>
        <button type="button" class="nav-menu-btn header-action-collapse" id="nav-open">工具</button>
        <div class="header-more-wrap">
          <button type="button" class="ghost-btn" id="header-more-toggle" aria-expanded="false" aria-controls="header-more-menu">更多</button>
          <div id="header-more-menu" class="header-more-menu" hidden role="menu">
            <button type="button" class="header-more-item" data-header-proxy="site-force-refresh">强制刷新</button>
            <a class="header-more-item" href="#about">关于</a>
            <a class="header-more-item" href="#setup">安装帮助</a>
          </div>
        </div>
      </div>
    </div>
    <p class="tagline">常用开发小工具合集 · 本地处理不上传 · 单工具工作台</p>
  </header>
  <div class="app-layout">
    <div class="nav-backdrop" id="nav-backdrop" hidden></div>
    <aside class="nav-bar" id="nav-bar" role="navigation" aria-label="工具导航" aria-hidden="true" inert>
      <div class="nav-drawer-head">
        <strong id="nav-drawer-title">选择工具</strong>
        <button type="button" class="ghost-btn nav-close-btn" id="nav-close">关闭</button>
      </div>
      <label class="nav-search-wrap" for="tool-search">
        <span class="visually-hidden">搜索工具</span>
        <input id="tool-search" class="nav-search" type="search" placeholder="搜索工具…" autocomplete="off" enterkeyhint="search" />
      </label>
      <div class="nav-compact-bar">
        <label class="nav-setting nav-compact-setting" for="nav-compact">
          <input type="checkbox" id="nav-compact" />
          <span>仅显示分类</span>
        </label>
      </div>
      <div class="nav-bar-scroll" id="nav-bar-scroll">
        <div class="nav-strip nav-recent" id="tool-recent" hidden>
          <button type="button" class="nav-strip-toggle" id="tool-recent-toggle">
            <span class="nav-strip-toggle-label">最近使用</span>
            <span class="nav-strip-toggle-meta" id="tool-recent-count"></span>
          </button>
          <div class="nav-strip-list nav-recent-list" id="tool-recent-list"></div>
        </div>
        <div class="nav-strip nav-favorites nav-group" id="tool-favorites" data-group="favorites">
          <div class="nav-strip-head nav-fav-head">
            <p class="nav-group-title nav-fav-title" id="tool-fav-title">常用工具</p>
            <button type="button" class="nav-fav-add" id="tool-fav-add">+</button>
          </div>
          <div class="nav-fav-picker" id="tool-fav-picker" hidden></div>
          <div class="nav-group-tools nav-fav-tools" id="tool-fav-list"></div>
        </div>
        <nav class="tool-nav" id="tool-nav"></nav>
      </div>
      <div class="nav-footer-actions">
        <p class="nav-cache-meta" id="nav-cache-meta">暂无缓存</p>
        <div class="nav-footer-toolbar">
          <button type="button" class="nav-reset nav-footer-btn nav-organize-open" id="nav-organize-open">整理顺序</button>
          <button type="button" class="nav-reset nav-cache-clear nav-footer-btn" id="nav-cache-clear">清理缓存</button>
          <button type="button" class="nav-reset nav-footer-btn" id="nav-reset">默认排序</button>
        </div>
      </div>
    </aside>
    <main class="shell">
      <div class="workspace-top" id="workspace-top">
        <div class="workspace-tool-meta">
          <div class="workspace-title-wrap">
            <h1 class="workspace-title" id="workspace-title">时间戳</h1>
            <span id="dr-top-badge" class="dr-top-badge" hidden></span>
          </div>
          <div class="workspace-tool-actions">
            <button type="button" class="ghost-btn site-chrome-toggle-float" id="site-chrome-toggle-float">显示顶栏</button>
            <button type="button" class="ghost-btn workspace-share" id="workspace-share">分享</button>
            <button type="button" class="ghost-btn workspace-switch" id="workspace-switch">切换工具</button>
          </div>
        </div>
        <div class="category-subnav media-subnav" id="category-subnav" hidden></div>
      </div>
      <div id="workspace-panels" class="workspace-panels">
        <div id="devtools-tool-load" class="workspace-panel-load" hidden aria-hidden="true" role="status">
          <div class="workspace-panel-load-card">
            <div class="workspace-panel-load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="workspace-panel-load-fill devtools-tool-load-fill"></span>
            </div>
            <p class="workspace-panel-load-label hint tight" id="devtools-tool-load-label" hidden></p>
          </div>
        </div>
      </div>
      <section class="devtools-giscus-wrap" hidden aria-label="评论区">
        <div id="devtools-giscus"></div>
      </section>
    </main>
  </div>
  <div id="toast" hidden></div>
  <button type="button" id="pwa-install" hidden></button>
  <dialog class="memo-dialog theme-dlg" id="theme-dlg" aria-label="主题设置">
    <div class="theme-dlg-shell">
      <div class="memo-dialog-body theme-dlg-body">
        <div class="label-row">
          <h2 class="subhead">站点主题</h2>
        </div>
        <div class="theme-presets" id="theme-presets"></div>
        <label class="flag" for="theme-use-custom"><input type="checkbox" id="theme-use-custom" /> 使用自定义颜色</label>
        <div class="theme-custom-box" id="theme-custom-box" hidden>
          <div class="theme-color-grid">
            <label>背景 <input type="color" id="theme-color-bg0" value="#0b1220" /></label>
            <label>文字 <input type="color" id="theme-color-ink" value="#e8eef8" /></label>
            <label>次要文字 <input type="color" id="theme-color-muted" value="#93a0b8" /></label>
            <label>强调色 <input type="color" id="theme-color-accent" value="#2ec4b6" /></label>
            <label>辅助强调 <input type="color" id="theme-color-accent2" value="#f4a261" /></label>
            <label>面板底 <input type="color" id="theme-color-panel" value="#0e1626" /></label>
          </div>
        </div>
        <span id="theme-bg-status" hidden></span>
        <input id="theme-bg-file" type="file" hidden />
        <button type="button" id="theme-bg-clear" hidden></button>
        <input id="theme-bg-overlay" type="range" hidden />
        <span id="theme-bg-overlay-val" hidden></span>
        <input id="theme-reduce-glow" type="checkbox" hidden />
      </div>
      <div class="theme-dlg-actions btn-row tool-actions">
        <button type="button" class="ghost-btn" id="theme-reset">恢复默认</button>
        <button type="button" class="primary-btn" id="theme-close">完成</button>
      </div>
    </div>
  </dialog>
  <dialog class="memo-dialog adb-getprop-dlg" id="adb-getprop-dlg" aria-label="系统属性 getprop">
    <div class="memo-dialog-body adb-getprop-dlg-body">
      <div class="label-row">
        <h2 class="subhead">系统属性</h2>
        <span class="hint tight" id="adb-getprop-meta">打开后加载</span>
      </div>
      <div class="field-row adb-getprop-toolbar">
        <input id="adb-getprop-search" class="mono" type="search" placeholder="搜索 key 或 value…" autocomplete="off" spellcheck="false" />
        <button type="button" class="ghost-btn" id="adb-getprop-reload">刷新</button>
      </div>
      <div class="channel-meta adb-info adb-getprop-list" id="adb-getprop-list" hidden></div>
      <p class="hint tight" id="adb-getprop-empty" hidden>无匹配项</p>
      <div class="btn-row tool-actions adb-getprop-dlg-actions">
        <button type="button" class="primary-btn" id="adb-getprop-close">关闭</button>
      </div>
    </div>
  </dialog>
  <dialog class="nav-recent-dlg" id="nav-recent-dlg" aria-labelledby="nav-recent-dlg-title">
    <div class="nav-recent-dlg-head">
      <h2 id="nav-recent-dlg-title">最近使用</h2>
      <button type="button" class="ghost-btn nav-recent-dlg-close" id="nav-recent-dlg-close" aria-label="关闭">×</button>
    </div>
    <div class="nav-recent-dlg-body" id="nav-recent-dlg-list" role="list"></div>
  </dialog>
  <dialog class="nav-organize-dlg" id="nav-organize" aria-labelledby="nav-organize-title">
    <div class="nav-organize-head">
      <div class="nav-organize-head-text">
        <h2 id="nav-organize-title">整理菜单</h2>
        <p class="hint tight nav-organize-sub">长按名称或拖 ⠿ 排序。</p>
      </div>
      <button type="button" class="ghost-btn nav-organize-close" id="nav-organize-close" aria-label="关闭">×</button>
    </div>
    <div class="nav-organize-tabs" role="tablist">
      <button type="button" class="nav-organize-tab is-active" role="tab" id="nav-org-tab-groups" data-nav-org-tab="groups" aria-selected="true">分类</button>
      <button type="button" class="nav-organize-tab" role="tab" id="nav-org-tab-tools" data-nav-org-tab="tools" aria-selected="false">工具</button>
      <button type="button" class="nav-organize-tab" role="tab" id="nav-org-tab-favorites" data-nav-org-tab="favorites" aria-selected="false">常用</button>
    </div>
    <label class="nav-organize-search-wrap" for="nav-org-search">
      <input type="search" id="nav-org-search" class="nav-organize-search text-input" placeholder="搜索分类或工具…" />
    </label>
    <div class="nav-organize-body">
      <div class="nav-organize-panel" id="nav-org-panel-groups" data-nav-org-panel="groups" role="tabpanel"></div>
      <div class="nav-organize-panel" id="nav-org-panel-tools" data-nav-org-panel="tools" role="tabpanel" hidden>
        <label class="nav-organize-group-pick" for="nav-org-tool-group">
          <span>所属分类</span>
          <select id="nav-org-tool-group" class="text-input"></select>
        </label>
        <div class="nav-organize-list" id="nav-org-tool-list"></div>
      </div>
      <div class="nav-organize-panel" id="nav-org-panel-favorites" data-nav-org-panel="favorites" role="tabpanel" hidden></div>
    </div>
    <div class="nav-organize-foot btn-row">
      <button type="button" class="ghost-btn" id="nav-organize-reset">恢复默认</button>
      <button type="button" class="ghost-btn" id="nav-organize-cancel">取消</button>
      <button type="button" class="primary-btn" id="nav-organize-done">完成</button>
    </div>
  </dialog>
  <div class="nav-tool-ctx" id="nav-tool-ctx" role="menu" hidden>
    <button type="button" class="nav-tool-ctx-item" data-nav-ctx="open">打开</button>
    <button type="button" class="nav-tool-ctx-item" data-nav-ctx="fav-add">添加到常用工具</button>
    <button type="button" class="nav-tool-ctx-item" data-nav-ctx="fav-remove" hidden>从常用移除</button>
  </div>
  <div class="memo-temp-prompt-stack" id="memo-temp-prompt-stack" aria-live="polite"></div>
  <div class="vsplit-fs" id="vsplit-fs" hidden>
    <div class="vsplit-fs-top">
      <button type="button" class="ghost-btn vsplit-fs-close" id="vsplit-fs-close">退出</button>
      <div class="vsplit-fs-meta">
        <strong class="vsplit-fs-status" id="vsplit-fs-status">已完成 0 段</strong>
        <span class="mono vsplit-fs-now" id="vsplit-fs-now">0:00 / 0:00</span>
      </div>
    </div>
    <div class="vsplit-fs-host" id="vsplit-fs-host">
      <div class="vsplit-fs-flash" id="vsplit-fs-flash" aria-hidden="true"></div>
    </div>
    <p class="vsplit-fs-note" id="vsplit-fs-note" hidden></p>
    <div class="vsplit-fs-scrub" id="vsplit-fs-scrub-slot"></div>
    <div class="vsplit-fs-bottom">
      <button type="button" class="secondary-btn" id="vsplit-fs-play">播放</button>
      <button type="button" class="ghost-btn" id="vsplit-fs-mute" aria-pressed="true">开声音</button>
      <button type="button" class="ghost-btn" id="vsplit-fs-undo" disabled>取消上一段</button>
      <button type="button" class="primary-btn vsplit-fs-mark" id="vsplit-fs-mark">打起点</button>
    </div>
  </div>
  <div id="countdown-fs" class="countdown-fs" hidden>
    <button type="button" class="countdown-fs-close ghost-btn" id="cd-fs-close">退出</button>
    <p class="countdown-fs-kicker hint" id="cd-fs-kicker">进行中</p>
    <p class="countdown-fs-step hint" id="cd-fs-step"></p>
    <p class="countdown-fs-content" id="cd-fs-content"></p>
    <p class="countdown-fs-time mono" id="cd-fs-time">00:00</p>
    <div class="btn-row countdown-fs-actions">
      <button type="button" class="primary-btn" id="cd-fs-next" hidden>下一步</button>
      <button type="button" class="primary-btn" id="cd-fs-done" hidden>完成</button>
    </div>
  </div>
  <div id="dateremind-fs" class="dateremind-fs" hidden>
    <button type="button" class="dateremind-fs-close ghost-btn" id="dr-fs-close">关闭</button>
    <p class="dateremind-fs-kicker hint">日期提醒</p>
    <h2 class="dateremind-fs-heading">临近的重要日期</h2>
    <div id="dr-fs-list" class="dr-fs-list"></div>
    <div class="btn-row dateremind-fs-actions">
      <button type="button" class="ghost-btn" id="dr-fs-dismiss-today">今日不再提醒</button>
      <button type="button" class="secondary-btn" id="dr-fs-goto">管理提醒</button>
      <button type="button" class="primary-btn" id="dr-fs-ok">知道了</button>
    </div>
  </div>
  <div id="muyu-fs" class="muyu-fs" data-muyu-theme="zen" hidden>
    <canvas id="muyu-fs-bg" class="muyu-fs-bg" aria-hidden="true"></canvas>
    <div class="muyu-fs-moon" aria-hidden="true"></div>
    <div class="muyu-fs-pulse" id="muyu-fs-pulse" aria-hidden="true"></div>
    <button type="button" class="muyu-fs-close ghost-btn" id="muyu-fs-close">退出全屏</button>
    <label class="muyu-fs-sound flag" for="muyu-sound-fs">
      <input type="checkbox" id="muyu-sound-fs" checked /> 音效
    </label>
    <header class="muyu-fs-head">
      <p class="muyu-fs-title">电子木鱼</p>
      <p class="muyu-fs-count-label hint">累计敲击</p>
      <p class="muyu-fs-count mono" id="muyu-fs-count">0</p>
    </header>
    <div class="muyu-fs-stage" id="muyu-fs-stage">
      <div class="muyu-fs-halo" aria-hidden="true"></div>
      <div class="muyu-fs-ripple" id="muyu-fs-ripple" aria-hidden="true"></div>
      <button type="button" class="muyu-fish-btn muyu-fish-btn-fs" id="muyu-fish-fs" aria-label="敲木鱼"></button>
      <div class="muyu-fs-fx" id="muyu-fs-fx" aria-hidden="true"></div>
    </div>
    <div class="muyu-fs-floats" id="muyu-fs-floats" aria-hidden="true"></div>
  </div>
  <div id="ruler-fs" class="ruler-fs" hidden>
    <canvas id="ruler-fs-canvas" class="ruler-fs-canvas" aria-label="全屏直尺"></canvas>
    <button type="button" class="ruler-fs-close ghost-btn" id="ruler-fs-close">退出全屏</button>
    <p class="ruler-fs-hud mono hint" id="ruler-coord-fs"></p>
  </div>
  <script src="./lib/bridge-token.js?v=2026.09.10-222347"></script>
  <script src="./lib/unified-bridge-bundle.js?v=2026.09.10-222347"></script>
  <script src="./lib/bridge-shell.js?v=2026.09.10-222347"></script>
  <script src="./lib/giscus-config.js?v=2026.09.10-222347"></script>
  <script src="./lib/giscus.js?v=2026.09.10-222347"></script>
  <script src="./lib/tool-registry.js?v=2026.09.10-222347"></script>
  <script src="./lib/nav-scale.js?v=2026.09.10-222347"></script>
  <script src="./lib/lazy-scripts.js?v=2026.09.10-222347"></script>
  <script src="./lib/panel-loader.js?v=2026.09.10-222347"></script>
  <script src="./theme.js?v=2026.09.10-222347"></script>
  <script src="./app.js?v=2026.09.10-222347"></script>
</body>
</html>

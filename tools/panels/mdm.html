<section id="mdm" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>Markdown 文档管理</h1>
      </div>
      <div class="panel-body mdm-body">
        <div class="mdm-topbar">
          <button type="button" class="primary-btn" id="mdm-pick-dir">选择文件夹</button>
          <button type="button" class="secondary-btn" id="mdm-use-idb">本地存储模式</button>
          <button type="button" class="secondary-btn" id="mdm-new" disabled>新建</button>
          <label class="file-btn" for="mdm-import">导入 MD</label>
          <input id="mdm-import" type="file" accept=".md,.markdown,.txt,text/markdown" multiple hidden />
          <button type="button" class="secondary-btn" id="mdm-import-dir" disabled>导入文件夹</button>
          <input id="mdm-import-dir-input" type="file" webkitdirectory directory multiple hidden />
          <button type="button" class="secondary-btn" id="mdm-export-lib" disabled>导出库</button>
          <button type="button" class="secondary-btn" id="mdm-import-lib" disabled>导入库</button>
          <input id="mdm-import-lib-input" type="file" accept=".zip,application/zip" hidden />
          <button type="button" class="primary-btn" id="mdm-save" disabled>保存</button>
          <span class="mdm-export-group">
            <select id="mdm-export-fmt" class="select-input" disabled aria-label="导出格式"></select>
            <button type="button" class="secondary-btn" id="mdm-export" disabled>导出</button>
          </span>
          <span class="hint tight" id="mdm-dir-label"></span>
        </div>
        <p class="error" id="mdm-error" hidden></p>

        <div class="mdm-layout" id="mdm-layout" hidden>
          <aside class="mdm-side">
            <input id="mdm-search" class="mono mdm-search" type="search" placeholder="搜索标题/正文，或 tag:xx cat:xx" autocomplete="off" />
            <div class="mdm-side-tools">
              <select id="mdm-sort" class="select-input" title="排序">
                <option value="order">自定义顺序</option>
                <option value="recent">最近打开</option>
                <option value="title">按标题</option>
                <option value="updated">最近修改</option>
                <option value="size">按大小</option>
              </select>
              <span class="hint tight" id="mdm-count"></span>
            </div>
            <div class="mdm-batchbar" id="mdm-batchbar" hidden>
              <span class="hint tight" id="mdm-batch-count"></span>
              <button type="button" class="ghost-btn" data-batch="all">全选</button>
              <button type="button" class="ghost-btn" data-batch="tag">加标签</button>
              <button type="button" class="ghost-btn" data-batch="cat">分类</button>
              <button type="button" class="ghost-btn" data-batch="rename">重命名</button>
              <button type="button" class="ghost-btn" data-batch="export">导出</button>
              <button type="button" class="ghost-btn" data-batch="delete">删除</button>
              <button type="button" class="ghost-btn" data-batch="clear">取消</button>
            </div>
            <div class="mdm-group" id="mdm-cats"></div>
            <div class="mdm-group" id="mdm-tags"></div>
            <div class="mdm-list-wrap" id="mdm-list-wrap">
              <div class="mdm-list" id="mdm-list" role="listbox" aria-label="文档列表" aria-live="polite"></div>
            </div>
          </aside>

          <main class="mdm-main">
            <p class="mdm-conflict" id="mdm-conflict" hidden>
              ⚠ 该文件已被外部修改（另一标签页/编辑器/云同步）。
              <button type="button" class="secondary-btn" data-conflict="overwrite">用我的覆盖</button>
              <button type="button" class="secondary-btn" data-conflict="reload">重新加载对方</button>
              <button type="button" class="ghost-btn" data-conflict="copy">另存为副本</button>
            </p>
            <div class="mdm-main-toolbar">
              <span class="seg" role="group" aria-label="视图">
                <button type="button" class="seg-btn is-active" id="mdm-mode-edit">编辑</button>
                <button type="button" class="seg-btn" id="mdm-mode-split">分屏</button>
                <button type="button" class="seg-btn" id="mdm-mode-preview">预览</button>
              </span>
              <input id="mdm-title" class="mdm-title mono" placeholder="标题" autocomplete="off" />
              <span class="mdm-insert-menu">
                <button type="button" class="secondary-btn" id="mdm-insert-toggle" title="插入内容">插入 ▾</button>
                <div class="mdm-insert-dropdown" id="mdm-insert-dropdown" hidden>
                  <button type="button" data-insert="link">链接</button>
                  <button type="button" data-insert="code">代码块</button>
                  <button type="button" data-insert="table">表格</button>
                  <button type="button" data-insert="tableedit">表格编辑…</button>
                  <button type="button" data-insert="task">任务列表</button>
                  <button type="button" data-insert="math-inline">行内公式</button>
                  <button type="button" data-insert="math-block">块级公式</button>
                  <button type="button" data-insert="mermaid">Mermaid 图</button>
                  <button type="button" data-insert="divider">分隔线</button>
                  <button type="button" data-insert="date">当前日期</button>
                  <button type="button" data-insert="file">文件 / 图片附件…</button>
                  <button type="button" data-insert="img-url">图片 URL…</button>
                  <button type="button" data-insert="clean-assets">清理未引用资源</button>
                  <button type="button" data-insert="rescan">重新扫描文件夹</button>
                  <button type="button" data-insert="trash">回收站…</button>
                  <button type="button" data-insert="history">历史版本…</button>
                  <button type="button" data-insert="keys">自定义快捷键…</button>
                  <button type="button" data-insert="usage">存储占用…</button>
                  <button type="button" data-insert="checklinks">检查链接</button>
                  <button type="button" data-insert="warm">搜索预热设置…</button>
                  <button type="button" data-insert="help">快捷键帮助</button>
                  <label class="flag" style="padding:0.35rem 0.55rem"><input type="checkbox" id="mdm-img-compress" checked /> 插入图片时自动压缩</label>
                </div>
              </span>
              <span class="hint tight" id="mdm-save-status"></span>
              <span class="hint tight" id="mdm-doc-stats" style="margin-left:auto"></span>
              <button type="button" class="ghost-btn" id="mdm-delete" title="删除当前文档">删除</button>
              <input id="mdm-file-input" type="file" multiple hidden />
            </div>
            <div class="mdm-meta-row">
              <label for="mdm-cat">分类</label>
              <input id="mdm-cat" class="mono mdm-cat" list="mdm-cat-list" placeholder="选择或输入分类" autocomplete="off" />
              <datalist id="mdm-cat-list"></datalist>
              <label>标签</label>
              <span class="mdm-tag-chips" id="mdm-tag-chips"></span>
              <input id="mdm-tag-input" class="mono mdm-tag-input" list="mdm-tag-list" placeholder="输入标签后回车" autocomplete="off" />
              <datalist id="mdm-tag-list"></datalist>
            </div>
            <div class="mdm-editor-wrap" id="mdm-editor-wrap">
              <div class="mdm-editor" id="mdm-editor"></div>
              <div class="mdm-splitter" id="mdm-splitter" role="separator" aria-orientation="vertical" title="拖动调整宽度"></div>
              <div class="mdm-preview markdown-body" id="mdm-preview"></div>
            </div>
            <p class="hint tight mdm-empty-hint" id="mdm-empty">左侧选择或新建一个文档开始。</p>
          </main>

          <aside class="mdm-outline">
            <div id="mdm-outline-body"></div>
            <div class="mdm-backlinks" id="mdm-backlinks"></div>
          </aside>
        </div>
      </div>
    </section>
    <div class="mdm-modal" id="mdm-modal" hidden>
      <div class="mdm-modal-box" id="mdm-modal-box" role="dialog" aria-modal="true"></div>
    </div>

<section id="mdm" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>Markdown 文档管理</h1>
      </div>
      <div class="panel-body mdm-body">
        <div class="mdm-topbar">
          <button type="button" class="primary-btn" id="mdm-pick-dir" title="选择本机文件夹作为存储：文档以真实 .md 文件保存，可用 VS Code / Obsidian / Git 直接编辑">选择文件夹</button>
          <button type="button" class="secondary-btn" id="mdm-use-idb" title="改用浏览器本地存储（IndexedDB）：不需要文件夹权限，数据存在浏览器里；清除浏览器数据会丢失，建议配合「导出库」备份">本地存储模式</button>
          <button type="button" class="secondary-btn" id="mdm-new" disabled title="新建一篇空白文档（在标题框输入即可改名）">新建</button>
          <label class="file-btn" id="mdm-import-label" for="mdm-import" title="导入本机的 .md / .markdown / .txt 文件，可多选；正文里引用的图片会一并导入">导入 MD</label>
          <input id="mdm-import" type="file" accept=".md,.markdown,text/markdown" multiple hidden />
          <button type="button" class="secondary-btn mdm-wide-only" id="mdm-import-dir" disabled title="选择一个文件夹，把里面所有 .md 连同引用的图片一起导入（仅文件夹模式可用）">导入文件夹</button>
          <input id="mdm-import-dir-input" type="file" webkitdirectory directory multiple hidden />
          <button type="button" class="secondary-btn mdm-wide-only" id="mdm-export-lib" disabled title="把整个库（索引 + 所有 .md + assets 资源）打包成一个 ZIP 下载，用于备份或迁移">导出库</button>
          <button type="button" class="secondary-btn mdm-wide-only" id="mdm-import-lib" disabled title="读取「导出库」生成的 ZIP，把文档、分类标签和资源合并进当前存储（同名文件跳过）">导入库</button>
          <input id="mdm-import-lib-input" type="file" accept=".zip,application/zip" hidden />
          <button type="button" class="primary-btn" id="mdm-save" disabled title="保存当前文档（Ctrl/⌘ + S）；开启自动保存后基本无需手动点">保存</button>
          <span class="mdm-insert-menu mdm-wide-only">
            <button type="button" class="secondary-btn" id="mdm-export-toggle" disabled title="导出当前文档（点开选格式）">导出 ▾</button>
            <div class="mdm-insert-dropdown mdm-export-dropdown" id="mdm-export-dropdown" hidden></div>
          </span>
          <span class="mdm-insert-menu mdm-narrow-only">
            <button type="button" class="secondary-btn" id="mdm-more-toggle" title="更多操作">更多 ▾</button>
            <div class="mdm-insert-dropdown" id="mdm-more-dropdown" hidden>
              <button type="button" data-more="import-dir">导入文件夹</button>
              <button type="button" data-more="export-lib">导出库</button>
              <button type="button" data-more="import-lib">导入库</button>
              <button type="button" data-more="copy">复制到剪贴板</button>
              <div class="mdm-menu-label">导出为</div>
              <div id="mdm-more-formats"></div>
            </div>
          </span>
          <button type="button" class="secondary-btn mdm-wide-only" id="mdm-copy" disabled title="复制预览内容到剪贴板（带格式；图片会内联，可直接粘到微信/Word）">复制</button>
          <span class="hint tight" id="mdm-dir-label"></span>
        </div>
        <p class="error" id="mdm-error" hidden></p>

        <div class="mdm-layout" id="mdm-layout" hidden>
          <aside class="mdm-side">
            <div class="mdm-side-icons">
              <button type="button" class="ghost-btn mdm-icon-btn" id="mdm-search-toggle" title="搜索标题与正文（Ctrl+Shift+F）" aria-label="搜索">⌕</button>
              <button type="button" class="ghost-btn mdm-icon-btn" id="mdm-sort-toggle" title="排序" aria-label="排序" aria-haspopup="menu">⇅</button>
              <button type="button" class="ghost-btn mdm-icon-btn" id="mdm-group-toggle" title="分组" aria-label="分组" aria-haspopup="menu">⊞</button>
            </div>
            <div class="mdm-batchbar" id="mdm-batchbar" hidden>
              <span class="hint tight" id="mdm-batch-count"></span>
              <button type="button" class="ghost-btn" data-batch="all" title="选中当前筛选结果里的全部文档">全选</button>
              <button type="button" class="ghost-btn" data-batch="tag" title="给选中的文档批量添加标签">加标签</button>
              <button type="button" class="ghost-btn" data-batch="untag" title="从选中的文档里移除某个标签">移除标签</button>
              <button type="button" class="ghost-btn" data-batch="rename" title="批量重命名：统一给选中文档的标题加前缀 / 后缀">重命名</button>
              <button type="button" class="ghost-btn" data-batch="export" title="把选中的文档导出为一个 ZIP">导出</button>
              <button type="button" class="ghost-btn" data-batch="delete" title="把选中的文档移入回收站">删除</button>
              <button type="button" class="ghost-btn" data-batch="clear" title="取消所有选中">取消</button>
            </div>
            <div class="mdm-group" id="mdm-tags"></div>
            <div class="mdm-list-wrap" id="mdm-list-wrap">
              <div class="mdm-list" id="mdm-list" role="listbox" aria-label="文档列表" aria-live="polite"></div>
            </div>
          </aside>

          <main class="mdm-main">
            <p class="mdm-conflict" id="mdm-conflict" hidden>
              ⚠ 该文件已被外部修改（另一标签页/编辑器/云同步）。
              <button type="button" class="secondary-btn" data-conflict="overwrite">用我的覆盖</button>
              <button type="button" class="secondary-btn" data-conflict="reload">重新加载对方</button>
              <button type="button" class="ghost-btn" data-conflict="copy">另存为副本</button>
            </p>
            <div class="mdm-main-toolbar">
              <span class="seg" role="group" aria-label="视图">
                <button type="button" class="seg-btn is-active" id="mdm-mode-edit">编辑</button>
                <button type="button" class="seg-btn" id="mdm-mode-split">分屏</button>
                <button type="button" class="seg-btn" id="mdm-mode-preview">预览</button>
              </span>
              <button type="button" class="ghost-btn mdm-max-btn" id="mdm-max" title="全屏编辑（Esc 退出）">⛶</button>
              <button type="button" class="ghost-btn mdm-max-btn" id="mdm-toggle-side" title="隐藏 / 显示左侧文件列表">◧</button>
              <button type="button" class="ghost-btn mdm-max-btn" id="mdm-toggle-top" title="隐藏 / 显示顶部按钮">▭</button>
              <input id="mdm-title" class="mdm-title mono" placeholder="标题" autocomplete="off" />
              <span class="mdm-insert-menu">
                <button type="button" class="secondary-btn" id="mdm-insert-toggle" title="插入内容">插入 ▾</button>
                <div class="mdm-insert-dropdown" id="mdm-insert-dropdown" hidden>
                  <button type="button" data-insert="link">链接</button>
                  <button type="button" data-insert="code">代码块</button>
                  <button type="button" data-insert="table">表格</button>
                  <button type="button" data-insert="tableedit">表格编辑…</button>
                  <button type="button" data-insert="task">任务列表</button>
                  <button type="button" data-insert="math-inline">行内公式</button>
                  <button type="button" data-insert="math-block">块级公式</button>
                  <button type="button" data-insert="mermaid">Mermaid 图</button>
                  <button type="button" data-insert="divider">分隔线</button>
                  <button type="button" data-insert="date">当前日期</button>
                  <button type="button" data-insert="file">文件 / 图片附件…</button>
                  <button type="button" data-insert="img-url">图片 URL…</button>
                  <label class="flag mdm-menu-flag"><input type="checkbox" id="mdm-img-compress" checked /> 插入图片时自动压缩</label>
                </div>
              </span>
              <span class="mdm-insert-menu">
                <button type="button" class="secondary-btn" id="mdm-tools-toggle" title="更多工具">工具 ▾</button>
                <div class="mdm-insert-dropdown" id="mdm-tools-dropdown" hidden>
                  <button type="button" data-insert="reveal-current">打开当前文档位置…</button>
                  <button type="button" data-insert="trash">回收站…</button>
                  <button type="button" data-insert="history">历史版本…</button>
                  <button type="button" data-insert="usage">存储占用…</button>
                  <button type="button" data-insert="checklinks">检查链接</button>
                  <button type="button" data-insert="replace">查找替换…</button>
                  <button type="button" data-insert="clean-assets">清理未引用资源</button>
                  <button type="button" data-insert="rescan">重新扫描文件夹</button>
                  <button type="button" data-insert="change-dir">更换文件夹…</button>
                  <button type="button" data-insert="warm">搜索预热设置…</button>
                  <button type="button" data-insert="keys">自定义快捷键…</button>
                  <button type="button" data-insert="help">快捷键帮助</button>
                  <button type="button" data-insert="rate">评价 / 留言…</button>
                  <label class="flag mdm-menu-flag"><input type="checkbox" id="mdm-autosave" checked /> 自动保存（1.8 秒后写入）</label>
                </div>
              </span>
              <span class="hint tight" id="mdm-save-status"></span>
              <button type="button" class="ghost-btn" id="mdm-delete" title="删除当前文档">删除</button>
              <input id="mdm-file-input" type="file" multiple hidden />
            </div>
            <div class="mdm-meta-row">
              <label>标签</label>
              <span class="mdm-tag-chips" id="mdm-tag-chips"></span>
              <input id="mdm-tag-input" class="mono mdm-tag-input" list="mdm-tag-list" placeholder="输入标签后回车" autocomplete="off" />
              <datalist id="mdm-tag-list"></datalist>
              <span class="hint tight" id="mdm-doc-stats"></span>
            </div>
            <div class="mdm-editor-wrap" id="mdm-editor-wrap">
              <div class="mdm-editor" id="mdm-editor"></div>
              <div class="mdm-minimap" id="mdm-minimap" title="文档概览：点或拖动跳转"></div>
              <div class="mdm-splitter" id="mdm-splitter" role="separator" aria-orientation="vertical" title="拖动调整宽度"></div>
              <div class="mdm-preview markdown-body" id="mdm-preview"></div>
            </div>
            <p class="hint tight mdm-empty-hint" id="mdm-empty">左侧选择或新建一个文档开始。</p>
          </main>

          <aside class="mdm-outline" id="mdm-outline-aside">
            <button type="button" class="mdm-outline-toggle" id="mdm-outline-toggle" title="收起 / 展开大纲" aria-label="收起或展开大纲">⇥</button>
            <div class="mdm-outline-inner" id="mdm-outline-inner">
              <div id="mdm-outline-body"></div>
              <div class="mdm-backlinks" id="mdm-backlinks"></div>
            </div>
          </aside>
        </div>
      </div>
      <div class="mdm-modal mdm-search-modal" id="mdm-search-modal" hidden>
        <div class="mdm-modal-box mdm-search-box" role="dialog" aria-modal="true" aria-label="搜索文档">
          <input id="mdm-search" class="mono mdm-search" type="search" placeholder="搜索标题与正文…" autocomplete="off" />
          <div class="mdm-search-meta hint tight" id="mdm-search-meta"></div>
          <div class="mdm-search-results" id="mdm-search-results" role="listbox" aria-label="搜索结果"></div>
        </div>
      </div>
      <div class="mdm-pop mdm-menu-pop" id="mdm-sort-menu" hidden role="menu"></div>
      <div class="mdm-pop mdm-menu-pop" id="mdm-group-menu" hidden role="menu"></div>
      <div class="mdm-modal" id="mdm-modal" hidden>
        <div class="mdm-modal-box" id="mdm-modal-box" role="dialog" aria-modal="true"></div>
      </div>
    </section>

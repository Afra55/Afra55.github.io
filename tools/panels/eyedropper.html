<section id="eyedropper" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>屏幕取色</h1>
        <p>支持浏览器屏幕取色；也可上传图片后在图片上点击取色。</p>
      </div>
      <div class="panel-body">
        <div class="btn-row tool-actions">
          <button type="button" class="primary-btn" id="eye-pick">屏幕取色</button>
          <label class="file-btn" for="eye-file">上传图片取色</label>
          <input id="eye-file" type="file" accept="image/*" hidden />
        </div>
        <p class="hint" id="eye-hint">Chrome / Edge 桌面版支持屏幕取色；Firefox / Safari 请用下方「上传图片取色」，点击图片取样。</p>
        <div class="convert-grid" style="margin-top:1rem">
          <div class="field-block">
            <div class="swatch-stack"><div class="swatch-checker"></div><div class="swatch" id="eye-swatch"></div></div>
            <div class="channel-meta" style="border-top:1px solid var(--line);padding-top:0.8rem;margin-top:0.8rem">
              <div class="meta-row"><span>HEX</span><strong class="mono" id="eye-hex">#000000</strong><button type="button" class="copy-btn" data-copy="eye-hex">复制</button></div>
              <div class="meta-row"><span>RGB</span><strong class="mono" id="eye-rgb">rgb(0, 0, 0)</strong><button type="button" class="copy-btn" data-copy="eye-rgb">复制</button></div>
              <div class="meta-row"><span>AHEX</span><strong class="mono" id="eye-ahex">#FF000000</strong><button type="button" class="copy-btn" data-copy="eye-ahex">复制</button></div>
            </div>
          </div>
          <div class="field-block">
            <img id="eye-img" class="img-preview eye-img" alt="上传图片后可点击取色" hidden />
            <p class="hint" id="eye-meta"></p>
          </div>
        </div>
        <p class="error" id="eye-error" hidden></p>
      </div>
    </section>

<section id="gife" class="panel tool-panel gif-tool-panel" data-reveal>
  <div class="panel-head gif-tool-head">
    <p class="gif-tool-kicker">GIF</p>
    <h1>GIF 编辑</h1>
    <p class="gif-tool-lead">拖进度看当前帧，用黄柄去片头/片尾；要删中间就拖到那一帧点「添加删除段」（红段）。默认只裁时长、不裁画面；需要裁画面时再打开下方「裁剪画面」。</p>
  </div>
  <div class="panel-body gif-tool-body">
    <div class="gif-tool-card">
      <div class="field-block" style="margin-top:1.5rem">
        <div class="btn-row tool-actions">
          <label class="file-btn" for="gife-file">选择 GIF</label>
          <input id="gife-file" type="file" accept="image/gif,.gif" hidden />
          <button type="button" class="ghost-btn" id="gife-clear">清空</button>
        </div>
        <p class="hint" id="gife-meta"></p>

        <div class="imgkit-crop-editor gife-crop-editor" id="gife-crop-editor" hidden>
          <div class="imgkit-crop-stage" id="gife-crop-stage">
            <canvas id="gife-crop-canvas" width="1" height="1"></canvas>
            <div class="imgkit-crop-box" id="gife-crop-box" hidden>
              <span class="imgkit-crop-handle" data-gife-handle="nw"></span>
              <span class="imgkit-crop-handle" data-gife-handle="n"></span>
              <span class="imgkit-crop-handle" data-gife-handle="ne"></span>
              <span class="imgkit-crop-handle" data-gife-handle="e"></span>
              <span class="imgkit-crop-handle" data-gife-handle="se"></span>
              <span class="imgkit-crop-handle" data-gife-handle="s"></span>
              <span class="imgkit-crop-handle" data-gife-handle="sw"></span>
              <span class="imgkit-crop-handle" data-gife-handle="w"></span>
            </div>
          </div>
        </div>

        <div class="gife-trim" id="gife-trim" hidden>
          <div class="gife-transport" aria-label="预览与选段">
            <button type="button" class="ghost-btn" id="gife-play" title="只播放黄框内要保留的段">预览保留段</button>
            <button type="button" class="ghost-btn" id="gife-prev" title="上一帧">上一帧</button>
            <button type="button" class="ghost-btn" id="gife-next" title="下一帧">下一帧</button>
            <button type="button" class="ghost-btn" id="gife-mark-start" title="把当前帧设为保留起点">设为起点</button>
            <button type="button" class="ghost-btn" id="gife-mark-end" title="把当前帧设为保留终点">设为终点</button>
            <button type="button" class="secondary-btn" id="gife-cut-add" title="从当前帧起添加一段要删的中间帧">添加删除段</button>
            <button type="button" class="ghost-btn" id="gife-cut-mark-start" title="把当前帧标成删除起点">删除起点</button>
            <button type="button" class="ghost-btn" id="gife-cut-mark-end" title="把当前帧标成删除终点并生成红段">删除终点</button>
            <button type="button" class="ghost-btn" id="gife-cut-del" title="去掉当前选中的红段" disabled>删选中段</button>
            <button type="button" class="ghost-btn" id="gife-cut-clear" title="清空全部中间删除段">清空删除段</button>
            <span class="mono gife-clock" id="gife-clock">—</span>
          </div>
          <div class="gife-timeline" id="gife-timeline" aria-label="拖黄柄选择保留段，红段为删中间，拖胶片看当前帧">
            <canvas id="gife-filmstrip" class="gife-filmstrip" width="640" height="56" aria-hidden="true"></canvas>
            <div class="gife-sel" id="gife-sel">
              <span class="gife-window" id="gife-window" aria-hidden="true"></span>
              <span class="gife-cutouts" id="gife-cutouts" aria-hidden="true"></span>
              <span class="gife-handle gife-handle-start" id="gife-handle-start" role="slider" aria-label="保留起点" tabindex="0"></span>
              <span class="gife-handle gife-handle-end" id="gife-handle-end" role="slider" aria-label="保留终点" tabindex="0"></span>
              <span class="gife-playhead" id="gife-playhead" aria-hidden="true"></span>
            </div>
          </div>
          <p class="hint tight" id="gife-trim-hint">黄框是留下的段；红段是删中间。拖进度到要删的那一帧 →「添加删除段」，再拖红柄；或点「删除起点 / 删除终点」。预览会跳过红段和片头片尾。</p>
        </div>

        <details class="gife-trim-advanced">
          <summary>用帧号微调（可选）</summary>
          <div class="field-row" style="flex-wrap:wrap;margin-top:0.55rem;align-items:center">
            <label for="gife-trim-head">去掉前</label>
            <input id="gife-trim-head" class="mono meta-input" type="number" min="0" max="9999" step="1" value="0" title="去掉前几帧" />
            <span class="hint tight">帧</span>
            <label for="gife-trim-tail">去掉后</label>
            <input id="gife-trim-tail" class="mono meta-input" type="number" min="0" max="9999" step="1" value="0" title="去掉后几帧" />
            <span class="hint tight">帧</span>
          </div>
        </details>

        <details class="gife-crop-advanced" id="gife-crop-details">
          <summary>裁剪画面（可选）</summary>
          <p class="hint tight" style="margin-top:0.45rem">默认不裁画面。打开后拖绿框选区域，可拖到整幅；也可自动去黑边。</p>
          <div class="field-row" style="flex-wrap:wrap;margin-top:0.55rem;align-items:center">
            <label for="gife-crop-x">裁剪 X%</label>
            <input id="gife-crop-x" class="mono meta-input" type="number" min="0" max="99" value="0" />
            <label for="gife-crop-y">Y%</label>
            <input id="gife-crop-y" class="mono meta-input" type="number" min="0" max="99" value="0" />
            <label for="gife-crop-w">W%</label>
            <input id="gife-crop-w" class="mono meta-input" type="number" min="1" max="100" value="100" />
            <label for="gife-crop-h">H%</label>
            <input id="gife-crop-h" class="mono meta-input" type="number" min="1" max="100" value="100" />
            <button type="button" class="ghost-btn" id="gife-auto-crop" disabled title="自动检测黑边并填入裁剪区域">自动去黑边</button>
            <button type="button" class="ghost-btn" id="gife-reset-crop" disabled>重置为整幅</button>
          </div>
        </details>

        <div class="btn-row tool-actions" style="margin-top:1rem;flex-wrap:wrap">
          <button type="button" class="primary-btn" id="gife-apply" disabled>应用并导出</button>
          <a class="secondary-btn" id="gife-download" href="#" download="edited.gif" hidden>下载编辑后 GIF</a>
        </div>
        <div class="gif-progress" id="gife-progress" hidden>
          <div class="gif-progress-track" aria-hidden="true"><span class="gif-progress-fill" id="gife-progress-fill"></span></div>
          <p class="hint" id="gife-progress-text">准备中…</p>
        </div>
        <div class="gif-preview-wrap">
          <img id="gife-preview" class="img-preview gif-preview" alt="编辑后 GIF 预览" hidden />
        </div>
        <p class="error" id="gife-error" hidden></p>
      </div>
    </div>
  </div>
</section>

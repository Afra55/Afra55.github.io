<section id="gifmaker" class="panel tool-panel gif-tool-panel" data-reveal>
  <div class="panel-head gif-tool-head">
    <p class="gif-tool-kicker">GIF</p>
    <h1>多图合成 GIF</h1>
    <p class="gif-tool-lead">多张静态图合成动图，可调帧时长、宽度、质量与水印。</p>
  </div>
  <div class="panel-body gif-tool-body">
    <div class="gif-tool-card">
<div class="field-block">
            <div class="btn-row tool-actions">
              <label class="file-btn" for="gif-file">添加图片</label>
              <input id="gif-file" type="file" accept="image/*" multiple hidden />
              <button type="button" class="secondary-btn" id="gif-apply-delay">应用统一时长</button>
              <button type="button" class="ghost-btn" id="gif-clear">清空</button>
            </div>
            <div class="field-row" style="flex-wrap:wrap;margin-top:0.85rem">
              <label for="gif-delay">默认时长 (ms)</label>
              <input id="gif-delay" class="mono meta-input" type="number" min="20" max="10000" step="10" value="500" />
              <label for="gif-width">最大宽度</label>
              <input id="gif-width" class="mono meta-input" type="number" min="64" max="1280" step="1" value="480" />
              <label for="gif-quality">质量 (1–30，越小越好)</label>
              <input id="gif-quality" class="mono meta-input" type="number" min="1" max="30" step="1" value="10" />
            </div>
            <div class="field-row" style="flex-wrap:wrap;margin-top:0.55rem;align-items:center">
              <label class="flag"><input type="checkbox" id="gif-wm-enable" /> 右上角文字水印</label>
              <label for="gif-wm-text">文字</label>
              <input id="gif-wm-text" class="mono meta-input" type="text" value="Elliot718703" maxlength="40" style="min-width:10rem" />
              <label for="gif-wm-size">字号</label>
              <select id="gif-wm-size" class="mono select-input">
                <option value="small" selected>小</option>
                <option value="medium">中</option>
                <option value="large">大</option>
              </select>
            </div>
            <p class="hint" id="gif-meta">选择至少 2 张图片。单帧建议不超过 1280px，张数过多会较慢。</p>
            <div class="gif-frame-list" id="gif-frames" aria-live="polite"></div>
            <div class="btn-row tool-actions" style="margin-top:1rem;flex-wrap:wrap">
              <button type="button" class="primary-btn" id="gif-generate">生成 GIF</button>
              <button type="button" class="ghost-btn" id="gif-abort" hidden>取消</button>
              <label for="gif-compress-level" class="hint tight" style="margin:0">压缩</label>
              <select id="gif-compress-level" class="mono select-input" title="压缩档位">
                <option value="light">轻度</option>
                <option value="standard" selected>标准</option>
                <option value="strong">强力</option>
              </select>
              <button type="button" class="secondary-btn" id="gif-compress" disabled>压缩体积</button>
              <button type="button" class="secondary-btn" id="gif-compress-again" disabled hidden>继续压缩</button>
              <a class="secondary-btn" id="gif-download" href="#" download="animation.gif" hidden>下载 GIF</a>
            </div>
            <div class="gif-progress" id="gif-progress" hidden>
              <div class="gif-progress-track" aria-hidden="true"><span class="gif-progress-fill" id="gif-progress-fill"></span></div>
              <p class="hint" id="gif-progress-text">准备中…</p>
            </div>
            <div class="gif-preview-wrap">
              <img id="gif-preview" class="img-preview gif-preview" alt="生成的 GIF 预览" hidden />
            </div>
            <p class="error" id="gif-error" hidden></p>
          </div>
    </div>
  </div>
</section>

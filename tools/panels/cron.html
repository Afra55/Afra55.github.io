<section id="cron" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>Cron 表达式</h1>
        <p>解析标准 5 段 cron，并估算接下来几次触发时间。</p>
      </div>
      <div class="panel-body">
        <label for="cron-input">Cron</label>
        <input id="cron-input" class="mono" type="text" value="*/5 * * * *" spellcheck="false" autocomplete="off" />
        <p class="hint">格式：分 时 日 月 周（例 <span class="mono">0 9 * * 1-5</span>）</p>
        <div class="btn-row tool-actions">
          <button type="button" class="primary-btn" id="cron-run">解析</button>
        </div>
        <p class="hint" id="cron-desc"></p>
        <pre class="mono highlight-box" id="cron-next"></pre>
        <p class="error" id="cron-error" hidden></p>
      </div>
    </section>

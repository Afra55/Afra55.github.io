<section id="imgtext" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>图片转文字</h1>
        <p>本地 OCR（Tesseract.js）。首次识别会下载语言包；图片不上传到我们的服务器。支持中英混合。</p>
      </div>
      <div class="panel-body">
        <div class="convert-grid">
          <div class="field-block">
            <div class="btn-row tool-actions" style="flex-wrap:wrap">
              <label class="file-btn" for="imgtext-file">选择图片</label>
              <input id="imgtext-file" type="file" accept="image/*" hidden />
              <button type="button" class="ghost-btn" id="imgtext-clear">清除</button>
              <label for="imgtext-lang">语言
                <select id="imgtext-lang" class="select-input">
                  <option value="chi_sim+eng" selected>中文+英文</option>
                  <option value="chi_sim">仅中文</option>
                  <option value="eng">仅英文</option>
                </select>
              </label>
            </div>
            <div class="memo-drop imgtext-drop" id="imgtext-drop" style="margin-top:0.65rem">
              <p class="hint tight">拖拽图片到此处，或在本页 Ctrl/⌘+V 粘贴</p>
              <img id="imgtext-preview" class="imgtext-preview" alt="待识别图片" hidden />
              <p class="hint tight mono" id="imgtext-meta">未选择图片</p>
            </div>
            <div class="memo-progress" id="imgtext-progress" hidden style="margin-top:0.65rem">
              <div class="gif-progress-head">
                <p class="hint gif-progress-title" id="imgtext-progress-text">识别中…</p>
                <span class="mono gif-progress-pct" id="imgtext-progress-pct">0%</span>
              </div>
              <div class="gif-progress-track" aria-hidden="true"><span class="gif-progress-fill" id="imgtext-progress-fill"></span></div>
            </div>
            <div class="btn-row tool-actions" style="margin-top:0.65rem;flex-wrap:wrap">
              <button type="button" class="primary-btn" id="imgtext-run">开始识别</button>
              <button type="button" class="secondary-btn" id="imgtext-copy">复制文字</button>
              <button type="button" class="ghost-btn" id="imgtext-to-memo">保存到备忘录</button>
            </div>
            <p class="error" id="imgtext-error" hidden></p>
          </div>
          <div class="field-block">
            <label for="imgtext-out">识别结果</label>
            <textarea id="imgtext-out" class="area mono" rows="16" placeholder="识别出的文字会显示在这里…"></textarea>
          </div>
        </div>
      </div>
    </section>

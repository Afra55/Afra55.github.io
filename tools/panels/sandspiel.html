<section id="sandspiel" class="panel tool-panel sandspiel-panel" data-reveal>
      <div class="panel-body sandspiel-body">
        <div class="sandspiel-toolbar">
          <label class="sandspiel-fps-toggle" for="sandspiel-show-fps">
            <input type="checkbox" id="sandspiel-show-fps" checked />
            <span>显示 FPS</span>
          </label>
          <button type="button" class="ghost-btn sandspiel-fullscreen-btn" id="sandspiel-fullscreen" aria-pressed="false">全屏</button>
        </div>
        <div class="sandspiel-shell">
          <iframe id="sandspiel-frame" class="sandspiel-frame" title="落沙沙盒" loading="lazy" referrerpolicy="no-referrer"></iframe>
        </div>
      </div>
    </section>

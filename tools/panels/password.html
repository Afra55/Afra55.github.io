<section id="password" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>密码生成器</h1>
        <p>可配置长度、字符类型，生成多个随机密码。</p>
      </div>
      <div class="panel-body">
        <div class="field-row" style="flex-wrap:wrap">
          <label for="pw-length">长度</label>
          <input id="pw-length" class="mono meta-input" type="number" min="4" max="128" value="16" />
          <label for="pw-count">数量</label>
          <input id="pw-count" class="mono meta-input" type="number" min="1" max="20" value="5" />
        </div>
        <div class="field-row" style="flex-wrap:wrap">
          <label class="flag"><input id="pw-upper" type="checkbox" checked /> 大写</label>
          <label class="flag"><input id="pw-lower" type="checkbox" checked /> 小写</label>
          <label class="flag"><input id="pw-number" type="checkbox" checked /> 数字</label>
          <label class="flag"><input id="pw-symbol" type="checkbox" checked /> 符号</label>
          <label class="flag"><input id="pw-no-ambiguous" type="checkbox" /> 排除易混淆字符</label>
        </div>
        <div class="btn-row tool-actions">
          <button type="button" class="primary-btn" id="pw-generate">生成密码</button>
          <button type="button" class="copy-btn" data-copy-value="pw-output">复制全部</button>
        </div>
        <textarea id="pw-output" class="mono area" rows="8" readonly spellcheck="false" placeholder="点击「生成密码」后显示结果"></textarea>
        <p class="hint" id="pw-meta">打开页面后会自动生成一组示例密码。</p>
        <p class="error" id="pw-error" hidden></p>
      </div>
    </section>

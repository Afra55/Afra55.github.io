<section id="pdfcraft" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>PDF 工具箱</h1>
        <p>跳转至开源项目 <a href="https://github.com/PDFCraftTool/pdfcraft" target="_blank" rel="noopener noreferrer">PDFCraft</a> 中文官网：合并、拆分、压缩、转换等 100+ 工具，<strong>文件仅在浏览器本地处理</strong>，不上传服务器。本站仅提供入口，不嵌入其页面。</p>

          <div class="btn-row">
            <button type="button" class="primary-btn" id="pdfcraft-open">打开 PDFCraft 中文站</button>
            <a class="ghost-btn" id="pdfcraft-link" href="https://pdfcraft.devtoolcafe.com/zh/" target="_blank" rel="noopener noreferrer external">pdfcraft.devtoolcafe.com/zh</a>
          </div>
        </div>
      </div>

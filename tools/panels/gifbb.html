<section id="gifbb" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>已有 GIF 压黑盒</h1>
        <p>多选本地 GIF，按黑盒规则压至 ≤6MB；体积已符合要求的会跳过，不重复压缩。全程本地处理，不会上传。</p>
      </div>
      <div class="panel-body">
        <div class="btn-row tool-actions" style="flex-wrap:wrap">
          <label class="file-btn" for="gifbb-file">选择 GIF（可多选）</label>
          <input id="gifbb-file" type="file" accept="image/gif,.gif" multiple hidden />
          <button type="button" class="primary-btn" id="gifbb-run" disabled>压黑盒</button>
          <button type="button" class="secondary-btn" id="gifbb-zip" disabled title="打包已处理的 GIF">打包下载</button>
          <button type="button" class="ghost-btn" id="gifbb-clear">清空</button>
          <button type="button" class="ghost-btn" id="gifbb-abort" hidden>取消</button>
        </div>
        <div class="field-row" style="flex-wrap:wrap;margin-top:0.5rem;align-items:center">
          <label class="flag" for="gifbb-allow-scale">
            <input type="checkbox" id="gifbb-allow-scale" checked />
            允许缩小尺寸/画质以保证压进 6MB（关闭则保持原始尺寸）
          </label>
        </div>
        <div class="field-row" style="flex-wrap:wrap;margin-top:0.4rem;align-items:center">
          <label for="gifbb-max-mb">黑盒上限</label>
          <input id="gifbb-max-mb" class="mono meta-input" type="number" min="1" max="200" step="1" value="6" />
          <span class="hint tight">MB（全站黑盒通用，自动保存）</span>
        </div>
        <p class="hint" id="gifbb-meta">未选择 GIF</p>
        <div class="gif-progress" id="gifbb-progress" hidden>
          <div class="gif-progress-head">
            <p class="hint gif-progress-title" id="gifbb-progress-text">准备中…</p>
            <span class="mono gif-progress-pct" id="gifbb-progress-pct">0%</span>
          </div>
          <div class="gif-progress-track" aria-hidden="true"><span class="gif-progress-fill" id="gifbb-progress-fill"></span></div>
          <p class="hint tight gif-progress-sub" id="gifbb-progress-sub" hidden></p>
        </div>
        <div class="gif-frame-list" id="gifbb-list" hidden aria-live="polite"></div>
        <p class="error" id="gifbb-error" hidden></p>
      </div>
    </section>

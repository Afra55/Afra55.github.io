<section id="sitenav" class="panel tool-panel" data-reveal>
  <div class="panel-head">
    <h1>外链导航</h1>
    <p>本站「只提供入口」的外部工具合集。点卡片在新窗口打开；需要系统浏览器时会尽量跳出 PWA。</p>
  </div>
  <div class="panel-body">
    <label class="sitenav-search-wrap" for="sitenav-q">
      <span class="visually-hidden">搜索外链</span>
      <input id="sitenav-q" class="sitenav-search" type="search" placeholder="搜索名称 / 简介…" autocomplete="off" />
    </label>
    <div id="sitenav-grid" class="sitenav-grid" role="list"></div>
    <p class="hint tight" id="sitenav-empty" hidden>没有匹配的外链。</p>
  </div>
</section>

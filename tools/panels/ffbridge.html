<section id="ffbridge" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>FFmpeg 本机桥</h1>
        <p id="ff-head-desc">电脑上更优：用系统 FFmpeg 批量处理。手机请用网页内 FFmpeg（音频处理 / 视频修剪）保底。<a href="#setup">安装指南</a></p>
      </div>
      <div class="panel-body">
        <div class="ff-mode-banner panel-card" id="ff-mode-banner" aria-live="polite">
          <strong id="ff-mode-title">正在识别设备…</strong>
          <p class="hint tight" id="ff-mode-text"></p>
          <div class="btn-row tool-actions" id="ff-mode-actions" style="flex-wrap:wrap;margin-top:0.45rem"></div>
        </div>

        <div id="ff-bridge-panel">
        <div class="adb-status" id="ff-status">
          <div class="adb-status-main">
            <span class="adb-dot" id="ff-dot" aria-hidden="true"></span>
            <div>
              <strong id="ff-status-title">未连接本机桥</strong>
              <p class="hint tight" id="ff-status-text">电脑推荐先连本机桥。未连接时，少量文件可用下方「网页保底」入口。</p>
            </div>
          </div>
          <div class="btn-row tool-actions adb-status-actions">
            <button type="button" class="primary-btn" id="ff-connect">连接本机桥</button>
            <button type="button" class="secondary-btn" id="ff-refresh" disabled>刷新</button>
            <span class="adb-dl-bundle" id="ff-dl-bundle">
              <button type="button" class="secondary-btn" id="ff-dl-mac" data-ff-bundle="mac">下载 macOS 完整包</button>
              <button type="button" class="secondary-btn" id="ff-dl-win" data-ff-bundle="win">下载 Windows 完整包</button>
              <button type="button" class="secondary-btn" id="ff-dl-linux" data-ff-bundle="linux">下载 Linux 完整包</button>
            </span>
          </div>
        </div>

        <div class="field-row" style="flex-wrap:wrap;margin-top:0.85rem">
          <label for="ff-base">桥地址</label>
          <input id="ff-base" class="mono" type="text" value="http://127.0.0.1:17888" autocomplete="off" spellcheck="false" />
          <label for="ff-token">Token</label>
          <input id="ff-token" class="mono" type="text" value="devtools-bridge" autocomplete="off" spellcheck="false" />
        </div>
        <p class="hint">与 ADB <strong>共用一座本机桥</strong>：地址 <span class="mono">17888</span>、Token <span class="mono">devtools-bridge</span>。FFmpeg 接口在 <span class="mono">/ff/*</span>，视频下载见 <a href="#ytdlp">yt-dlp</a>（<span class="mono">/ytdlp/*</span>）。只需启动一次桥即可。</p>
        <p class="hint tight mono" id="ff-tools-probe" hidden></p>
        </div><!-- /ff-bridge-panel -->

        <div id="ff-workspace" hidden>
          <div class="label-row" style="margin-top:1rem">
            <h2 class="subhead">本机文件夹</h2>
            <span class="hint tight" id="ff-fs-meta">选择输入文件或文件夹</span>
          </div>
          <div class="adb-fs-shortcuts" id="ff-roots" style="margin-bottom:0.45rem"></div>
          <div class="adb-path-row">
            <button type="button" class="ghost-btn" id="ff-fs-up" title="上级目录">上级</button>
            <input id="ff-fs-path" class="mono" type="text" value="" spellcheck="false" autocomplete="off" />
            <button type="button" class="secondary-btn" id="ff-fs-go">打开</button>
            <button type="button" class="ghost-btn" id="ff-fs-refresh">刷新</button>
          </div>
          <div class="ff-fs-list adb-fs-list" id="ff-fs-list" role="list"></div>
          <div class="btn-row tool-actions" style="margin-top:0.55rem;flex-wrap:wrap">
            <button type="button" class="secondary-btn" id="ff-select-videos">勾选当前页媒体</button>
            <button type="button" class="ghost-btn" id="ff-clear-sel">清空已选</button>
            <span class="hint tight mono" id="ff-sel-meta">已选 0</span>
          </div>
          <p class="hint tight">也可勾选文件夹：任务会按当前操作扫描其中的视频/音频（可开「含子目录」）。</p>

          <div class="label-row" style="margin-top:1.1rem">
            <h2 class="subhead">批量任务</h2>
            <span class="hint tight" id="ff-op-desc">选择操作后填写参数</span>
          </div>
          <div class="field-row" style="flex-wrap:wrap;align-items:center;gap:0.45rem">
            <label for="ff-op">操作</label>
            <select id="ff-op" class="mono select-input" style="min-width:12rem"></select>
            <label class="flag"><input type="checkbox" id="ff-op-more" /> 显示更多</label>
          </div>
          <p class="hint tight" id="ff-op-webhint" hidden style="margin-top:0.35rem"></p>
          <div id="ff-op-opts" class="ff-op-opts" style="margin-top:0.55rem"></div>
          <div class="field-row" style="flex-wrap:wrap;margin-top:0.55rem;align-items:center">
            <label for="ff-outdir">输出目录</label>
            <input id="ff-outdir" class="mono" type="text" placeholder="例如 /Users/你/Movies/ff_out" spellcheck="false" autocomplete="off" style="flex:1;min-width:12rem" />
            <button type="button" class="ghost-btn" id="ff-outdir-here" title="用当前浏览目录下的子文件夹">用当前目录子文件夹</button>
          </div>
          <div class="field-row" style="flex-wrap:wrap;margin-top:0.45rem;align-items:center;gap:0.75rem">
            <label class="flag"><input type="checkbox" id="ff-recursive" /> 含子目录</label>
            <label class="flag"><input type="checkbox" id="ff-mkdir" checked /> 自动创建输出目录</label>
            <label class="flag"><input type="checkbox" id="ff-overwrite" /> 覆盖同名</label>
          </div>
          <div class="btn-row tool-actions" style="margin-top:0.65rem">
            <button type="button" class="primary-btn" id="ff-run">开始任务</button>
            <button type="button" class="ghost-btn" id="ff-probe-sel">探测已选</button>
            <button type="button" class="ghost-btn" id="ff-jobs-refresh">刷新任务</button>
          </div>
          <pre class="mono adb-pre" id="ff-probe-out" hidden style="margin-top:0.55rem;max-height:10rem;overflow:auto"></pre>
          <div class="adb-jobs-list" id="ff-jobs-list" aria-live="polite" style="margin-top:0.75rem"></div>
          <p class="error" id="ff-error" hidden></p>
        </div>
      </div>
    </section>

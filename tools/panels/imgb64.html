<section id="imgb64" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>图片 Base64</h1>
        <p>图片 ↔ Data URL / Base64：选图编码，或粘贴解码预览并下载。</p>
      </div>
      <div class="panel-body">
        <div class="btn-row tool-actions" style="flex-wrap:wrap">
          <label class="file-btn" for="img-file">选择图片 → Base64</label>
          <input id="img-file" type="file" accept="image/*" hidden />
          <button type="button" class="primary-btn" id="img-b64-decode">Base64 → 图片</button>
          <a class="secondary-btn" id="img-b64-download" href="#" download="image.png" hidden>下载图片</a>
        </div>
        <div class="convert-grid" style="margin-top:1rem">
          <div class="field-block">
            <img id="img-preview" class="img-preview" alt="预览将显示在这里" />
            <p class="hint" id="img-meta"></p>
          </div>
          <div class="field-block">
            <div class="label-row">
              <label for="img-b64">Data URL / Base64</label>
              <button type="button" class="copy-btn" data-copy-value="img-b64">复制</button>
            </div>
            <textarea id="img-b64" class="mono area" rows="10" spellcheck="false" placeholder="粘贴 data:image/...;base64,... 或纯 Base64，再点「Base64 → 图片」"></textarea>
          </div>
        </div>
        <p class="error" id="img-error" hidden></p>
      </div>
    </section>

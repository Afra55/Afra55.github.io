<section id="gifm" class="panel tool-panel gif-tool-panel" data-reveal>
  <div class="panel-head gif-tool-head">
    <p class="gif-tool-kicker">GIF</p>
    <h1>GIF 合并</h1>
    <p class="gif-tool-lead">按顺序拼接多条 GIF 为一条长动图（各段宽高不一致时会自动统一尺寸并居中补边）。</p>
  </div>
  <div class="panel-body gif-tool-body">
    <div class="gif-tool-card">
<div class="field-block" style="margin-top:1.5rem">
          <div class="btn-row tool-actions">
            <label class="file-btn" for="gifm-file">添加 GIF</label>
            <input id="gifm-file" type="file" accept="image/gif,.gif" multiple hidden />
            <button type="button" class="ghost-btn" id="gifm-clear">清空</button>
          </div>
          <p class="hint" id="gifm-meta">至少 2 个；宽高不一致时自动统一尺寸并补边（颜色见下方）。</p>
          <div class="gif-frame-list" id="gifm-list" aria-live="polite"></div>
          <div class="btn-row tool-actions" style="margin-top:1rem;flex-wrap:wrap">
            <button type="button" class="primary-btn" id="gifm-merge" disabled>合并为一条 GIF</button>
            <a class="secondary-btn" id="gifm-download" href="#" download="merged.gif" hidden>下载合并 GIF</a>
            <label class="flag" for="gifm-pad">尺寸不一时补边
              <select id="gifm-pad" class="mono meta-input">
                <option value="black" selected>黑边</option>
                <option value="white">白边</option>
              </select>
            </label>
          </div>
          <div class="gif-progress" id="gifm-progress" hidden>
            <div class="gif-progress-track" aria-hidden="true"><span class="gif-progress-fill" id="gifm-progress-fill"></span></div>
            <p class="hint" id="gifm-progress-text">准备中…</p>
          </div>
          <div class="gif-preview-wrap">
            <img id="gifm-preview" class="img-preview gif-preview" alt="合并 GIF 预览" hidden />
          </div>
          <p class="error" id="gifm-error" hidden></p>
        </div>
    </div>
  </div>
</section>

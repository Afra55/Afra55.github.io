<section id="vtrim" class="panel tool-panel" data-reveal role="tabpanel" aria-labelledby="media-tab-vtrim">
      <div class="panel-head">
        <h1>视频修剪</h1>
        <p>浏览器内 FFmpeg：修剪片头片尾、裁边框。手机可直接用。<span class="ff-desktop-only-hint">电脑批量可选 <a href="#ffbridge">本机桥</a>。</span><span id="vtrim-adapt-tip" class="hint tight"></span></p>
      </div>
      <div class="panel-body">
        <div class="btn-row tool-actions">
          <label class="file-btn" for="vtrim-file">选择视频</label>
          <input id="vtrim-file" type="file" accept="video/*,.mov,.mp4,.webm,.m4v" hidden />
          <button type="button" class="ghost-btn" id="vtrim-clear">清空</button>
          <button type="button" class="ghost-btn" id="vtrim-undo" disabled title="撤销上一步修剪或裁剪">撤销</button>
          <button type="button" class="ghost-btn" id="vtrim-reset" disabled title="恢复全长与未裁剪">重置编辑</button>
        </div>
        <p class="hint" id="vtrim-meta">支持 MP4 / WebM / MOV。选择后仅本机读取，不会上传。关闭页面会释放本次视频。</p>

        <div class="vtrim-stage" id="vtrim-stage" hidden>
          <div class="vtrim-preview-wrap" id="vtrim-preview-wrap">
            <video id="vtrim-video" class="vtrim-video" playsinline muted preload="metadata"></video>
            <button type="button" class="vtrim-tap-play" id="vtrim-tap-play" hidden aria-label="播放或暂停"></button>
            <p class="vtrim-film-loading hint" id="vtrim-film-loading" hidden>正在生成胶片预览…</p>
            <div class="vtrim-crop-box" id="vtrim-crop-box" hidden>
              <span class="vtrim-crop-grid" aria-hidden="true"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="nw"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="n"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="ne"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="e"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="se"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="s"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="sw"></span>
              <span class="vtrim-crop-handle" data-vtrim-handle="w"></span>
            </div>
          </div>

          <div class="vtrim-transport">
            <button type="button" class="secondary-btn" id="vtrim-play" disabled>播放</button>
            <button type="button" class="ghost-btn" id="vtrim-mute" disabled aria-pressed="true">开声音</button>
            <span class="mono vtrim-clock" id="vtrim-clock">0:00 / 0:00</span>
            <span class="hint tight" id="vtrim-range-label">保留全程</span>
          </div>

          <div class="field-row" style="flex-wrap:wrap;align-items:center;gap:0.45rem">
            <span class="seg" role="group" aria-label="编辑模式">
              <button type="button" class="seg-btn is-active" id="vtrim-mode-trim" data-vtrim-mode="trim">修剪时长</button>
              <button type="button" class="seg-btn" id="vtrim-mode-crop" data-vtrim-mode="crop">裁切画面</button>
            </span>
            <span class="hint tight" id="vtrim-mode-hint">拖黄框两端；预览区左右滑可 scrub</span>
          </div>

          <div class="vtrim-trim-tools" id="vtrim-trim-tools">
          <div class="btn-row tool-actions vtrim-nudge" aria-label="微调时长">
            <button type="button" class="ghost-btn" id="vtrim-nudge-start-m" disabled title="片头 −0.1s">片头 −0.1</button>
            <button type="button" class="ghost-btn" id="vtrim-nudge-start-p" disabled title="片头 +0.1s">片头 +0.1</button>
            <button type="button" class="ghost-btn" id="vtrim-nudge-end-m" disabled title="片尾 −0.1s">片尾 −0.1</button>
            <button type="button" class="ghost-btn" id="vtrim-nudge-end-p" disabled title="片尾 +0.1s">片尾 +0.1</button>
          </div>

          <div class="vtrim-timeline" id="vtrim-timeline" aria-label="修剪片头片尾">
            <canvas id="vtrim-filmstrip" class="vtrim-filmstrip" width="640" height="56" aria-hidden="true"></canvas>
            <div class="vtrim-sel" id="vtrim-sel">
              <span class="vtrim-window" id="vtrim-window" aria-hidden="true"></span>
              <span class="vtrim-handle vtrim-handle-start" id="vtrim-handle-start" role="slider" aria-label="片头" tabindex="0"></span>
              <span class="vtrim-handle vtrim-handle-end" id="vtrim-handle-end" role="slider" aria-label="片尾" tabindex="0"></span>
              <span class="vtrim-playhead" id="vtrim-playhead" aria-hidden="true"></span>
            </div>
          </div>
          <p class="hint tight">黄框两端拖片头/片尾 · 拖中间整体平移 · 点胶片跳转 · 播放只在保留区间循环</p>
          </div>

          <div class="vtrim-crop-tools" id="vtrim-crop-panel" hidden>
          <div class="field-row vtrim-crop-tools-row" style="flex-wrap:wrap;margin-top:0.35rem;align-items:center">
            <span class="seg" role="group" aria-label="裁剪比例">
              <button type="button" class="seg-btn is-active" data-vtrim-aspect="free">自由</button>
              <button type="button" class="seg-btn" data-vtrim-aspect="1:1">1:1</button>
              <button type="button" class="seg-btn" data-vtrim-aspect="16:9">16:9</button>
              <button type="button" class="seg-btn" data-vtrim-aspect="4:3">4:3</button>
              <button type="button" class="seg-btn" data-vtrim-aspect="9:16">9:16</button>
            </span>
            <button type="button" class="ghost-btn" id="vtrim-rot-l" disabled title="逆时针 90°">左转</button>
            <button type="button" class="ghost-btn" id="vtrim-rot-r" disabled title="顺时针 90°">右转</button>
            <button type="button" class="ghost-btn" id="vtrim-flip-h" disabled>水平翻转</button>
            <button type="button" class="ghost-btn" id="vtrim-crop-reset" disabled title="恢复为当前比例下的最大裁剪">重置裁剪</button>
            <label class="flag"><input type="checkbox" id="vtrim-crop-enable" checked /> 启用裁剪框</label>
          </div>
          <p class="hint tight" id="vtrim-crop-hint">拖绿框或角点裁边框 · 双击绿框重置 · 关闭裁剪框则只导出修剪时长</p>
          </div>
        </div>

        <div class="field-row" style="flex-wrap:wrap;align-items:center;gap:0.45rem;margin-top:0.75rem">
            <span class="seg" role="group" aria-label="导出内容">
              <button type="button" class="seg-btn is-active" data-vtrim-track="av">音视频</button>
              <button type="button" class="seg-btn" data-vtrim-track="video">仅视频</button>
              <button type="button" class="seg-btn" data-vtrim-track="audio">仅音频</button>
            </span>
            <span class="seg" id="vtrim-audio-fmt-seg" role="group" aria-label="音频格式" hidden>
              <button type="button" class="seg-btn is-active" data-vtrim-audio-fmt="m4a">M4A</button>
              <button type="button" class="seg-btn" data-vtrim-audio-fmt="mp3">MP3</button>
            </span>
            <canvas id="vtrim-crop-live" class="vtrim-crop-live" width="160" height="90" hidden aria-label="裁剪成片预览"></canvas>
          </div>
        <div class="vtrim-export-bar" id="vtrim-export-bar" hidden>
          <p class="hint tight mono" id="vtrim-summary">—</p>
          <div class="field-row" style="flex-wrap:wrap;align-items:center;gap:0.45rem">
            <span class="seg" role="group" aria-label="导出画质">
              <button type="button" class="seg-btn is-active" data-vtrim-quality="fast">快速</button>
              <button type="button" class="seg-btn" data-vtrim-quality="hq">清晰</button>
            </span>
            <span class="hint tight">仅裁切/旋转重编码时生效；纯修剪仍走快速剪切</span>
          </div>
        </div>
        <div class="btn-row tool-actions" style="margin-top:0.75rem;flex-wrap:wrap">
          <button type="button" class="primary-btn" id="vtrim-export" disabled>导出视频</button>
          <button type="button" class="ghost-btn" id="vtrim-abort" hidden>取消</button>
          <a class="secondary-btn" id="vtrim-download" href="#" download="trimmed.mp4" hidden>下载结果</a>
        </div>
        <div class="gif-progress" id="vtrim-progress" hidden>
          <div class="gif-progress-head">
            <p class="hint gif-progress-title" id="vtrim-progress-text">准备中…</p>
            <span class="mono gif-progress-pct" id="vtrim-progress-pct">0%</span>
          </div>
          <div class="gif-progress-track" aria-hidden="true"><span class="gif-progress-fill" id="vtrim-progress-fill"></span></div>
          <p class="hint tight gif-progress-sub" id="vtrim-progress-sub" hidden></p>
        </div>
        <div class="vtrim-result-block" id="vtrim-result-block" hidden>
          <h2 class="subhead">导出预览</h2>
          <p class="hint tight" id="vtrim-result-meta"></p>
          <div class="gif-preview-wrap" style="margin-top:0.45rem">
            <video id="vtrim-result" class="img-preview gif-preview" controls playsinline preload="metadata" hidden></video>
            <audio id="vtrim-result-audio" class="audio-player" controls preload="metadata" hidden style="width:100%;margin-top:0.35rem"></audio>
          </div>
        </div>
        <p class="error" id="vtrim-error" hidden></p>
      </div>
    </section>

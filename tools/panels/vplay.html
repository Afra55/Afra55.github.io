<section id="vplay" class="panel tool-panel" data-reveal role="tabpanel" aria-labelledby="media-tab-vplay">
      <div class="panel-head">
        <h1>视频播放</h1>
        <p>本地选视频或<strong>拖入视频文件</strong>即可预览：<strong>滚轮缩放</strong>、<strong>拖拽移动画面</strong>、<strong>双击暂停/播放</strong>。双指可捏合缩放。仅本机读取，不会上传。</p>
      </div>
      <div class="panel-body">
        <div class="btn-row tool-actions">
          <label class="file-btn" for="vplay-file">选择视频</label>
          <input id="vplay-file" type="file" accept="video/*,.mov,.mp4,.webm,.m4v" hidden />
          <button type="button" class="ghost-btn" id="vplay-clear">清空</button>
        </div>
        <p class="hint" id="vplay-meta">支持 MP4 / WebM / MOV。点「选择视频」、拖入下方黑色区域，或点击黑色区域选择。滚轮缩放 · 拖拽移动 · 双击暂停/播放。</p>
        <div class="vplay-stage" id="vplay-stage">
          <div class="vplay-zoom-wrap" id="vplay-zoom-wrap" title="可拖入视频文件；滚轮缩放，拖拽移动，双击暂停/播放">
            <p class="vplay-empty-hint hint" id="vplay-empty-hint">拖入视频文件到此处<br /><span class="hint tight">或点击选择 · MP4 / WebM / MOV</span></p>
            <video id="vplay-video" playsinline preload="auto" hidden></video>
            <div class="vplay-zoom-hud" aria-label="缩放控制" hidden>
              <button type="button" class="ghost-btn vplay-zoom-btn" id="vplay-zoom-out" disabled title="缩小">－</button>
              <span class="mono vplay-zoom-pct" id="vplay-zoom-pct">100%</span>
              <button type="button" class="ghost-btn vplay-zoom-btn" id="vplay-zoom-in" disabled title="放大">＋</button>
              <button type="button" class="ghost-btn vplay-zoom-btn" id="vplay-zoom-reset" disabled title="还原">还原</button>
              <button type="button" class="ghost-btn vplay-zoom-btn" id="vplay-zoom-rotate" disabled title="旋转 90°">↻</button>
            </div>
            <div class="vplay-height-resize" id="vplay-height-resize" role="separator" aria-orientation="horizontal" aria-label="拖动调整预览高度" title="拖动调整高度"></div>
          </div>
          <div class="vplay-transport">
            <button type="button" class="ghost-btn vplay-transport-btn" id="vplay-play" disabled>播放</button>
            <button type="button" class="ghost-btn vplay-transport-btn" id="vplay-mute" disabled aria-pressed="true">开声音</button>
            <label class="visually-hidden" for="vplay-scrub">播放进度</label>
            <input id="vplay-scrub" class="vsplit-scrub vplay-scrub" type="range" min="0" max="1000" value="0" step="1" disabled />
            <span class="mono vplay-clock" id="vplay-clock">0:00 / 0:00</span>
            <button type="button" class="ghost-btn vplay-transport-btn" id="vplay-shot" disabled title="截取当前画面">截图</button>
            <button type="button" class="ghost-btn vplay-transport-btn" id="vplay-fs" disabled title="全屏">全屏</button>
          </div>
          <p class="hint tight">拖入视频即可播放 · 拖进度条实时预览 · 点「截图」保存当前画面 · 滚轮缩放 · 按住拖拽画面 · 底边可拉高预览区</p>
        </div>
        <div class="preview-info-panel" id="vplay-info" hidden>
          <h2 class="subhead preview-info-title">视频信息</h2>
          <dl class="preview-info-grid" id="vplay-info-grid"></dl>
        </div>
        <p class="error" id="vplay-error" hidden></p>
      </div>
    </section>

<section id="uuid" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>UUID 生成</h1>
        <p>生成 UUID v4，可批量输出。</p>
      </div>
      <div class="panel-body">
        <div class="field-row">
          <label for="uuid-count">数量</label>
          <input id="uuid-count" class="mono meta-input" type="number" min="1" max="200" value="5" />
          <label class="flag"><input id="uuid-upper" type="checkbox" /> 大写</label>
          <label class="flag"><input id="uuid-nohyphen" type="checkbox" /> 无连字符</label>
        </div>
        <div class="btn-row tool-actions">
          <button type="button" class="primary-btn" id="uuid-gen">生成</button>
          <button type="button" class="copy-btn" data-copy-value="uuid-out">复制</button>
        </div>
        <textarea id="uuid-out" class="mono area" rows="8" readonly spellcheck="false"></textarea>
      </div>
    </section>

<section id="qrcode" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>二维码</h1>
      </div>
      <div class="panel-body">
        <div class="convert-grid">
          <div class="field-block">
            <h2 class="subhead">生成</h2>
            <label for="qr-text">内容</label>
            <textarea id="qr-text" class="mono area" rows="4" placeholder="输入文本或网址" spellcheck="false"></textarea>
            <div class="btn-row tool-actions">
              <button type="button" class="primary-btn" id="qr-gen">生成</button>
              <button type="button" class="ghost-btn" id="qr-save" hidden>保存图片</button>
              <button type="button" class="ghost-btn" id="qr-share" hidden>分享图片</button>
            </div>
            <div id="qr-box-wrap" class="qr-box-wrap" aria-live="polite"></div>
            <p class="hint tight" id="qr-meta"></p>
            <p class="error" id="qr-error" hidden></p>
          </div>

          <div class="field-block">
            <h2 class="subhead">扫码</h2>
            <p class="hint tight">默认不开启摄像头；需要时点「扫码」，或用独立扫码页。</p>
            <div class="btn-row tool-actions">
              <button type="button" class="primary-btn" id="qr-cam-start">扫码</button>
              <button type="button" class="ghost-btn" id="qr-cam-stop" hidden>关闭</button>
              <label class="file-btn" for="qr-file">选图</label>
              <input id="qr-file" type="file" accept="image/*" hidden />
              <a class="ghost-btn" href="./qrscan/" target="_blank" rel="noopener">独立页</a>
            </div>
            <div class="qr-scan-wrap" id="qr-scan-stage" hidden>
              <video id="qr-video" class="qr-video" playsinline webkit-playsinline muted hidden></video>
              <div class="qr-scan-reticle" aria-hidden="true"></div>
              <canvas id="qr-scan-canvas" hidden></canvas>
              <img id="qr-scan-preview" class="img-preview" alt="" hidden />
            </div>
            <p class="hint tight" id="qr-multi-hint">同框有多个码时会全部列出，预览上编号框出；点列表可选中并复制。</p>
            <div class="label-row" style="margin-top:0.8rem" id="qr-result-head" hidden>
              <label for="qr-decoded" id="qr-decoded-label">扫描结果</label>
              <button type="button" class="copy-btn" data-copy-value="qr-decoded">复制当前</button>
            </div>
            <ul id="qr-decode-list" class="qr-hit-list" hidden></ul>
            <textarea id="qr-decoded" class="mono area" rows="4" readonly placeholder="" spellcheck="false" hidden></textarea>
            <p class="hint" id="qr-decode-meta" hidden></p>
            <p class="hint tight" id="qr-support-hint" hidden></p>
            <p class="error" id="qr-decode-error" hidden></p>
          </div>
        </div>
      </div>
    </section>

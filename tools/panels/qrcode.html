<section id="qrcode" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>二维码</h1>
      </div>
      <div class="panel-body">
        <div class="convert-grid">
          <div class="field-block">
            <h2 class="subhead">生成</h2>
            <label for="qr-text">内容</label>
            <textarea id="qr-text" class="mono area" rows="4" placeholder="输入文本或网址，例如 https://afra55.github.io/tools/" spellcheck="false"></textarea>
            <div class="btn-row tool-actions">
              <button type="button" class="primary-btn" id="qr-gen">生成</button>
            </div>
            <p class="hint tight">长文本会自动放大二维码（约 360～720px），方便手机扫；仍建议控制在约 300 字内更稳。</p>
            <div id="qr-box-wrap" class="qr-box-wrap" aria-live="polite"></div>
            <p class="hint tight" id="qr-meta"></p>
            <p class="error" id="qr-error" hidden></p>
          </div>

          <div class="field-block">
            <h2 class="subhead">识别</h2>
            <div class="btn-row tool-actions">
              <a class="primary-btn" href="./qrscan/" target="_blank" rel="noopener" title="独立扫码页，可单独加到安卓桌面">打开独立扫码（可加桌面）</a>
              <label class="file-btn" for="qr-file">选择图片识别</label>
              <input id="qr-file" type="file" accept="image/*" hidden />
              <button type="button" class="secondary-btn" id="qr-cam-start">打开摄像头</button>
              <button type="button" class="ghost-btn" id="qr-cam-stop" hidden>关闭摄像头</button>
            </div>
            <p class="hint">安卓想单独一个桌面图标：打开上方「独立扫码」→ Chrome ⋮ → 安装应用 / 添加到主屏幕。本页也可直接摄像头扫或选图识别（需 HTTPS 授权）。</p>
            <div class="qr-scan-wrap">
              <video id="qr-video" class="qr-video" playsinline muted hidden></video>
              <canvas id="qr-scan-canvas" hidden></canvas>
              <img id="qr-scan-preview" class="img-preview" alt="待识别图片预览" hidden />
            </div>
            <div class="label-row" style="margin-top:0.8rem">
              <label for="qr-decoded">识别结果</label>
              <button type="button" class="copy-btn" data-copy-value="qr-decoded">复制</button>
            </div>
            <textarea id="qr-decoded" class="mono area" rows="4" readonly placeholder="识别结果会显示在这里" spellcheck="false"></textarea>
            <p class="hint" id="qr-decode-meta"></p>
            <p class="error" id="qr-decode-error" hidden></p>
          </div>
        </div>
      </div>
    </section>

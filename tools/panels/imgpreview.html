<section id="imgpreview" class="panel tool-panel" data-reveal>
      <div class="panel-head">
        <h1>图片预览</h1>
        <p>一次添加多张图片叠放对比：<strong>拖拽</strong>移动、<strong>滚轮无极缩放</strong>（选中图；按住 Alt 滚轮缩放画布）、单击选中、底栏缩略图切换；可调透明度与前后层级，边缘靠近时自动吸附对齐。</p>
      </div>
      <div class="panel-body">
        <div class="btn-row tool-actions">
          <label class="file-btn" for="imgprev-file">添加图片</label>
          <input id="imgprev-file" type="file" accept="image/*" multiple hidden />
          <button type="button" class="ghost-btn" id="imgprev-clear">清空</button>
          <button type="button" class="ghost-btn" id="imgprev-reset-all">全部还原</button>
        </div>
        <p class="hint" id="imgprev-meta">支持多选 / 拖拽添加。滚轮无极缩放选中图（无选中则缩放画布）；拖拽移动图片；底栏缩略图可拖拽排序；底边可拉高预览区。</p>
        <div class="imgprev-stage" id="imgprev-stage">
          <div class="imgprev-viewport" id="imgprev-viewport">
            <p class="imgprev-empty-hint hint" id="imgprev-empty-hint">拖入图片到此处<br /><span class="hint tight">或点击选择 · 可多选</span></p>
            <div class="imgprev-world" id="imgprev-world"></div>
            <div class="imgprev-hud" aria-label="缩放信息">
              <span class="mono imgprev-hud-item">画布 <span id="imgprev-view-pct">100%</span></span>
              <span class="mono imgprev-hud-item">选中 <span id="imgprev-sel-scale">—</span></span>
            </div>
            <div class="imgprev-height-resize" id="imgprev-height-resize" role="separator" aria-orientation="horizontal" aria-label="拖动调整预览高度" title="拖动调整高度"></div>
          </div>
          <div class="imgprev-toolbar">
            <label class="imgprev-opacity-label">透明度
              <input id="imgprev-opacity" type="range" min="0" max="100" value="100" step="1" disabled />
              <span class="mono" id="imgprev-opacity-val">—</span>
            </label>
            <button type="button" class="ghost-btn" id="imgprev-layer-up" disabled title="上移一层">前移</button>
            <button type="button" class="ghost-btn" id="imgprev-layer-down" disabled title="下移一层">后移</button>
            <button type="button" class="ghost-btn" id="imgprev-reset-sel" disabled>还原选中</button>
          </div>
          <div class="imgprev-thumbs" id="imgprev-thumbs" hidden aria-label="缩略图"></div>
        </div>
        <div class="preview-info-panel" id="imgprev-info" hidden>
          <h2 class="subhead preview-info-title">图片信息</h2>
          <dl class="preview-info-grid" id="imgprev-info-grid"></dl>
        </div>
        <p class="error" id="imgprev-error" hidden></p>
      </div>
    </section>

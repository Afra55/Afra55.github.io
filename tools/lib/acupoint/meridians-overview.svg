<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="十四正经一览" class="acu-svg acu-svg-overview">
  <title>十四正经一览</title>
  <defs>
    <style>
      .box { fill: var(--panel, #151c28); stroke: var(--line, #3a4a5c); stroke-width: 1; }
      .abbr { fill: var(--accent, #6ec1ff); font-size: 13px; font-weight: 700; font-family: ui-monospace, monospace; }
      .name { fill: var(--ink, #e8edf4); font-size: 10px; font-family: system-ui, sans-serif; }
      .title { fill: var(--ink, #e8edf4); font-size: 12px; font-weight: 600; font-family: system-ui, sans-serif; }
      .has-mer-highlight .mer-box { opacity: 0.35; transition: opacity 0.15s ease; }
      .has-mer-highlight .mer-box.is-mer-active { opacity: 1; }
    </style>
  </defs>
  <text class="title" x="320" y="24" text-anchor="middle">十四正经 + 任督二脉</text>
  <g transform="translate(16,40)">
    <g class="mer-box" data-mer="LU"><rect class="box" x="0" y="0" width="140" height="52" rx="6"/><text class="abbr" x="10" y="22">LU</text><text class="name" x="36" y="22">手太阴肺经</text><text class="name" x="10" y="40" fill="var(--muted)">11 穴 · 寅时</text></g>
    <g class="mer-box" data-mer="LI"><rect class="box" x="152" y="0" width="140" height="52" rx="6"/><text class="abbr" x="162" y="22">LI</text><text class="name" x="188" y="22">手阳明大肠经</text><text class="name" x="162" y="40" fill="var(--muted)">20 穴 · 卯时</text></g>
    <g class="mer-box" data-mer="ST"><rect class="box" x="304" y="0" width="140" height="52" rx="6"/><text class="abbr" x="314" y="22">ST</text><text class="name" x="340" y="22">足阳明胃经</text><text class="name" x="314" y="40" fill="var(--muted)">45 穴 · 辰时</text></g>
    <g class="mer-box" data-mer="SP"><rect class="box" x="456" y="0" width="152" height="52" rx="6"/><text class="abbr" x="466" y="22">SP</text><text class="name" x="492" y="22">足太阴脾经</text><text class="name" x="466" y="40" fill="var(--muted)">21 穴 · 巳时</text></g>
    <g class="mer-box" data-mer="HT"><rect class="box" x="0" y="64" width="140" height="52" rx="6"/><text class="abbr" x="10" y="86">HT</text><text class="name" x="36" y="86">手少阴心经</text><text class="name" x="10" y="104" fill="var(--muted)">9 穴 · 午时</text></g>
    <g class="mer-box" data-mer="SI"><rect class="box" x="152" y="64" width="140" height="52" rx="6"/><text class="abbr" x="162" y="86">SI</text><text class="name" x="188" y="86">手太阳小肠经</text><text class="name" x="162" y="104" fill="var(--muted)">19 穴 · 未时</text></g>
    <g class="mer-box" data-mer="BL"><rect class="box" x="304" y="64" width="140" height="52" rx="6"/><text class="abbr" x="314" y="86">BL</text><text class="name" x="340" y="86">足太阳膀胱经</text><text class="name" x="314" y="104" fill="var(--muted)">67 穴 · 申时</text></g>
    <g class="mer-box" data-mer="KI"><rect class="box" x="456" y="64" width="152" height="52" rx="6"/><text class="abbr" x="466" y="86">KI</text><text class="name" x="492" y="86">足少阴肾经</text><text class="name" x="466" y="104" fill="var(--muted)">27 穴 · 酉时</text></g>
    <g class="mer-box" data-mer="PC"><rect class="box" x="0" y="128" width="140" height="52" rx="6"/><text class="abbr" x="10" y="150">PC</text><text class="name" x="36" y="150">手厥阴心包经</text><text class="name" x="10" y="168" fill="var(--muted)">9 穴 · 戌时</text></g>
    <g class="mer-box" data-mer="TE"><rect class="box" x="152" y="128" width="140" height="52" rx="6"/><text class="abbr" x="162" y="150">TE</text><text class="name" x="188" y="150">手少阳三焦经</text><text class="name" x="162" y="168" fill="var(--muted)">23 穴 · 亥时</text></g>
    <g class="mer-box" data-mer="GB"><rect class="box" x="304" y="128" width="140" height="52" rx="6"/><text class="abbr" x="314" y="150">GB</text><text class="name" x="340" y="150">足少阳胆经</text><text class="name" x="314" y="168" fill="var(--muted)">44 穴 · 子时</text></g>
    <g class="mer-box" data-mer="LR"><rect class="box" x="456" y="128" width="152" height="52" rx="6"/><text class="abbr" x="466" y="150">LR</text><text class="name" x="492" y="150">足厥阴肝经</text><text class="name" x="466" y="168" fill="var(--muted)">14 穴 · 丑时</text></g>
    <g class="mer-box" data-mer="CV"><rect class="box" x="76" y="192" width="200" height="52" rx="6"/><text class="abbr" x="86" y="214">CV</text><text class="name" x="112" y="214">任脉（腹中线）</text><text class="name" x="86" y="232" fill="var(--muted)">24 穴</text></g>
    <g class="mer-box" data-mer="GV"><rect class="box" x="292" y="192" width="200" height="52" rx="6"/><text class="abbr" x="302" y="214">GV</text><text class="name" x="328" y="214">督脉（背中线）</text><text class="name" x="302" y="232" fill="var(--muted)">28 穴</text></g>
  </g>
  <text class="name" x="320" y="340" text-anchor="middle" fill="var(--muted)">点选下方列表穴位可高亮对应经络 · 详细定位见文字说明</text>
</svg>

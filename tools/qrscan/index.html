<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="扫码" />
  <meta name="description" content="本地摄像头扫二维码与条形码" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-180.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <title>扫码</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header class="top">
    <strong class="brand-title">扫码</strong>
    <div class="top-actions">
      <button type="button" class="primary" id="qs-start" hidden>扫码</button>
      <button type="button" class="ghost" id="qs-stop" hidden>关闭</button>
      <label class="file-btn ghost">选图<input id="qs-file" type="file" accept="image/*" /></label>
    </div>
  </header>

  <section class="stage" id="qs-stage" aria-label="扫描框">
    <video id="qs-video" playsinline webkit-playsinline muted hidden></video>
    <img id="qs-preview" alt="" hidden />
    <div class="reticle" aria-hidden="true"></div>
    <canvas id="qs-canvas" hidden></canvas>
  </section>

  <p class="hint error" id="qs-error" hidden></p>
  <p class="hint" id="qs-status" hidden></p>
  <p class="hint support" id="qs-support" hidden></p>

  <section class="panel result" id="qs-result" hidden>
    <label for="qs-text">扫描结果</label>
    <textarea id="qs-text" readonly spellcheck="false"></textarea>
    <div class="row">
      <button type="button" class="primary" id="qs-copy">复制</button>
      <button type="button" id="qs-open" hidden>打开链接</button>
      <button type="button" class="primary" id="qs-again">继续扫</button>
    </div>
  </section>

  <section class="panel install-card" id="qs-install" hidden>
    <button type="button" class="primary" id="qs-install-btn" hidden>添加到桌面</button>
    <p class="hint" id="qs-install-hint" hidden></p>
  </section>

  <script src="./app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MD 阅读" />
  <meta name="description" content="专注预览单个 Markdown · 拖入即可 · 可单独加到桌面" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-180.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <title>MD 阅读</title>
  <link rel="stylesheet" href="./app.css" />
  <script src="../lib/theme-presets.js"></script>
</head>
<body>
  <!-- 隐藏选文件：空态点击 / 程序化打开用；无顶部按钮 -->
  <input id="mr-file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />

  <p class="error" id="mr-error" hidden></p>

  <div class="layout" id="mr-layout" hidden>
    <aside class="outline" id="mr-outline" aria-label="标题大纲">
      <p class="outline-label">大纲</p>
      <div class="outline-body" id="mr-outline-body"></div>
    </aside>
    <main class="stage" id="mr-stage">
      <div class="doc-meta">
        <h1 class="doc-title" id="mr-title">未命名</h1>
      </div>
      <article class="markdown-body preview" id="mr-preview"></article>
    </main>
  </div>

  <div class="drop-hint" id="mr-empty" role="button" tabindex="0" aria-label="点击或拖入 Markdown">
    <p class="drop-title">点击选择，或拖入 Markdown</p>
    <p class="hint">一次一篇 · 再拖新文件即可换文</p>
  </div>

  <script src="./preview.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>

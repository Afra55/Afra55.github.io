<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MD 阅读" />
  <meta name="description" content="专注预览单个 Markdown · 拖入即可 · 可单独加到桌面" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-180.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <title>MD 阅读</title>
  <link rel="stylesheet" href="./app.css" />
  <script src="../lib/theme-presets.js"></script>
</head>
<body>
  <!-- 隐藏选文件：空态点击 / 程序化打开用；无顶部按钮 -->
  <input id="mr-file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />

  <p class="error" id="mr-error" hidden></p>

  <div class="layout" id="mr-layout" hidden>
    <aside class="outline" id="mr-outline" aria-label="标题大纲">
      <p class="outline-label">大纲</p>
      <div class="outline-body" id="mr-outline-body"></div>
    </aside>
    <main class="stage" id="mr-stage">
      <div class="doc-meta">
        <h1 class="doc-title" id="mr-title">未命名</h1>
      </div>
      <article class="markdown-body preview" id="mr-preview"></article>
    </main>
  </div>

  <div class="drop-hint" id="mr-empty" tabindex="-1" aria-label="MD 阅读空状态">
    <div class="empty-shell">
      <p class="empty-brand">MD 阅读</p>
      <p class="empty-lead">专注预览一篇 Markdown，本地打开，不上传</p>

      <div
        class="empty-zone"
        id="mr-empty-zone"
        role="button"
        tabindex="0"
        aria-label="点击选择 Markdown 文件，也可拖入"
      >
        <span class="empty-zone-mark" aria-hidden="true"></span>
        <p class="empty-zone-title">把文件拖到这里</p>
        <p class="empty-zone-sub">支持 .md · .markdown · .txt</p>
      </div>

      <div class="empty-actions">
        <button type="button" class="empty-cta" id="mr-open-btn">打开文件</button>
        <button type="button" class="ghost-btn empty-secondary" id="mr-paste-btn">粘贴文本</button>
      </div>

      <ul class="empty-tips">
        <li>一次只读一篇，再拖新文件即可换文</li>
        <li>也可从工具站「文本工具 → MD 阅读」，或文档管理右键打开</li>
        <li>空页时可直接按粘贴快捷键贴入正文</li>
      </ul>
    </div>
  </div>

  <script src="./preview.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>

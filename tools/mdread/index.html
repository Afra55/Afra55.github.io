<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MD 阅读" />
  <meta name="description" content="专注预览单个 Markdown · 拖入即可 · 可单独加到桌面" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-180.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <title>MD 阅读</title>
  <link rel="stylesheet" href="./app.css?v=19" />
</head>
<body>
  <!-- 隐藏选文件：空态点击 / 程序化打开用；无顶部按钮 -->
  <input id="mr-file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />

  <p class="error" id="mr-error" hidden></p>

  <div class="layout" id="mr-layout" hidden>
    <aside class="outline" id="mr-outline" aria-label="标题大纲">
      <p class="outline-label">大纲</p>
      <div class="outline-body" id="mr-outline-body"></div>
      <div class="outline-foot">
        <button type="button" class="outline-theme-btn" id="mr-outline-theme-btn">配色</button>
      </div>
    </aside>
    <main class="stage" id="mr-stage">
      <div class="doc-meta">
        <h1 class="doc-title" id="mr-title"></h1>
      </div>
      <article class="markdown-body preview" id="mr-preview"></article>
    </main>
  </div>

  <div class="drop-hint" id="mr-empty" tabindex="-1" aria-label="MD 阅读空状态">
    <div class="empty-shell">
      <p class="empty-brand">MD 阅读</p>
      <p class="empty-lead">先选护眼配色，再打开 Markdown</p>

      <div class="empty-theme is-hero" id="mr-theme" role="radiogroup" aria-label="阅读配色">
        <p class="empty-theme-label">常用配色</p>
        <div class="empty-theme-row">
          <button type="button" class="empty-theme-chip" data-read-theme="paper" role="radio" aria-checked="false">
            <span class="empty-theme-preview" aria-hidden="true">
              <span class="empty-theme-swatch"></span>
              <span class="empty-theme-sample">Aa 示例</span>
            </span>
            <span class="empty-theme-name">纸张</span>
            <span class="empty-theme-mark" aria-hidden="true">已选</span>
          </button>
          <button type="button" class="empty-theme-chip" data-read-theme="sepia" role="radio" aria-checked="false">
            <span class="empty-theme-preview" aria-hidden="true">
              <span class="empty-theme-swatch"></span>
              <span class="empty-theme-sample">Aa 示例</span>
            </span>
            <span class="empty-theme-name">羊皮纸</span>
            <span class="empty-theme-mark" aria-hidden="true">已选</span>
          </button>
          <button type="button" class="empty-theme-chip" data-read-theme="soft" role="radio" aria-checked="false">
            <span class="empty-theme-preview" aria-hidden="true">
              <span class="empty-theme-swatch"></span>
              <span class="empty-theme-sample">Aa 示例</span>
            </span>
            <span class="empty-theme-name">柔和深色</span>
            <span class="empty-theme-mark" aria-hidden="true">已选</span>
          </button>
        </div>
        <button type="button" class="empty-theme-more" id="mr-theme-more">更多配色…</button>
        <p class="empty-theme-hint hint tight" id="mr-theme-hint">当前：纸张 · 点另一档立刻换色并记住</p>
      </div>

      <div
        class="empty-zone"
        id="mr-empty-zone"
        role="button"
        tabindex="0"
        aria-label="点击选择 Markdown 文件，也可拖入"
      >
        <span class="empty-zone-mark" aria-hidden="true"></span>
        <p class="empty-zone-title">把文件拖到这里</p>
        <p class="empty-zone-sub">支持 .md · .markdown · .txt</p>
      </div>

      <div class="empty-actions">
        <button type="button" class="empty-cta" id="mr-open-btn">打开文件</button>
        <button type="button" class="ghost-btn empty-secondary" id="mr-paste-btn">粘贴文本</button>
      </div>

      <ul class="empty-tips">
        <li>一次只读一篇，再拖新文件即可换文</li>
        <li>阅读中可在左侧大纲底部改配色</li>
        <li>空页时可直接按粘贴快捷键贴入正文</li>
      </ul>
    </div>
  </div>

  <div class="theme-modal" id="mr-theme-modal" hidden>
    <div class="theme-modal-backdrop" data-theme-modal-close tabindex="-1"></div>
    <div class="theme-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="mr-theme-modal-title">
      <header class="theme-modal-head">
        <h2 id="mr-theme-modal-title">阅读配色</h2>
        <button type="button" class="theme-modal-close" data-theme-modal-close aria-label="关闭">×</button>
      </header>
      <p class="theme-modal-lead hint tight">点预置可连续对比，不会自动关闭；点外侧或右上角 × 再关。也可自定义底色与字色。</p>
      <div class="theme-modal-grid" id="mr-theme-modal-grid" role="listbox" aria-label="预置配色"></div>
      <div class="theme-modal-custom">
        <p class="theme-modal-custom-label">自定义</p>
        <div class="theme-modal-custom-row">
          <label class="theme-modal-field">
            <span>背景</span>
            <input type="color" id="mr-custom-bg" value="#FAF7F2" />
          </label>
          <label class="theme-modal-field">
            <span>文字</span>
            <input type="color" id="mr-custom-ink" value="#292524" />
          </label>
          <label class="theme-modal-field theme-modal-scheme">
            <span>模式</span>
            <select id="mr-custom-scheme">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <button type="button" class="theme-modal-apply" id="mr-custom-apply">应用自定义</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./preview.js?v=19" defer></script>
  <script src="./app.js?v=19" defer></script>
</body>
</html>

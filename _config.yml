#########################################
# 评论：giscus（GitHub Discussions）
# 开启 Discussions + 安装 https://github.com/apps/giscus 后，
# 运行：node tools/scripts/fetch-giscus-ids.cjs
giscus:
  repo: Afra55/Afra55.github.io
  repo_id: "MDEwOlJlcG9zaXRvcnk0Njg1MDkxNw=="
  category: "Announcements"
  category_id: "DIC_kwDOAsrjZc4DEww8"
  mapping: pathname
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
